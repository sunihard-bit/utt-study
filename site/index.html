/* ------------------------------------------------------------------ n4 */
n4: [
 {tag:"every", h:"Radio stations on different channels",
  p:["Your car radio picks one station by its frequency. Wi-Fi works the same way, with radio waves on two main bands.","**2.4 GHz** is like a long country road that's always crowded: it reaches far, but it's busy. **5 GHz** is a fast new highway with more lanes, but it doesn't go as far."],
  vis:{k:"compare", cols:[{h:"2.4 GHz",items:["Longer range, better through walls","Slower","Crowded: microwaves, Bluetooth, neighbours","Only 3 non-overlapping channels: 1, 6, 11"]},{h:"5 GHz",items:["Shorter range","Faster","Less interference","Many more channels"]}]}},
 {tag:"def", h:"The IEEE 802.11 standards",
  p:["**IEEE 802.11** is the family of Wi-Fi standards. Speeds are the maximum in theory; real speeds are lower."],
  vis:{k:"table", h:["Standard","Wi-Fi name","Band","Max speed"], rows:[["802.11a","–","5 GHz","54 Mbps"],["802.11b","–","2.4 GHz","11 Mbps"],["802.11g","–","2.4 GHz","54 Mbps"],["802.11n","Wi-Fi 4","2.4 and 5 GHz","600 Mbps"],["802.11ac","Wi-Fi 5","5 GHz","about 3.5 Gbps"],["802.11ax","Wi-Fi 6 / 6E","2.4 and 5 GHz (6E adds 6 GHz)","about 9.6 Gbps"]]},
  tricky:"Odd one out: **802.11a** is old but uses **5 GHz**. **b** and **g** are 2.4 GHz only. Memory aid: 'a' came with the 'faraway-numbered' 5."},
 {tag:"def", h:"Wireless security",
  p:["Anyone nearby can pick up Wi-Fi signals, so the data must be **encrypted**."],
  vis:{k:"table", h:["Security","Encryption","Verdict"], rows:[["**WEP**","RC4 (weak)","❌ Broken: can be cracked in minutes"],["**WPA**","TKIP","❌ Outdated stop-gap"],["**WPA2**","AES (CCMP)","✅ Good: the minimum to use"],["**WPA3**","AES, with SAE for passwords","✅ Best: newest and strongest"]]},
  after:"**Personal** mode uses one shared passphrase (home). **Enterprise** mode gives each user their own login through a RADIUS server (UTT, companies)."},
 {tag:"ex", h:"Worked example: securing a new home router",
  vis:{k:"steps", items:[["🔑","Change the router's **admin** password (not just the Wi-Fi password)"],["🛡️","Choose **WPA3** (or WPA2-AES if older devices need it)"],["🔤","Set a long Wi-Fi passphrase: 12+ characters, not the family's names or phone number"],["📛","Rename the SSID so it doesn't give away the router model or your address"],["⬆️","Update the **firmware**"],["🚫","Turn off **WPS** (the push-button/PIN setup), which can be attacked"]]}},
 {tag:"tricky", h:"Hiding the SSID isn't security",
  p:["Hiding the network name or allowing only certain MAC addresses (**MAC filtering**) sounds safe, but tools can see hidden SSIDs, and MAC addresses can be copied (spoofed)."],
  tricky:"Real protection comes from **strong encryption (WPA2/WPA3) plus a strong passphrase**."},
 {tag:"mist", h:"Common mistakes",
  mist:[["'802.11a is 2.4 GHz because it's the first letter'","802.11a uses 5 GHz.","a = 5 GHz; b and g = 2.4 GHz; n = both; ac = 5 GHz; ax = both (6E adds 6 GHz)."],
   ["Thinking 5 GHz always wins","It's faster but has shorter range and goes through walls less well.","Far away or through walls → 2.4 GHz. Close and fast → 5 GHz."],
   ["Choosing WEP because it's 'still encryption'","WEP can be cracked in minutes.","Use WPA3, or WPA2 with AES."]]},
 {tag:"check", h:"Quick check",
  check:{q:"Which Wi-Fi standard is also called Wi-Fi 6?", o:["802.11n","802.11ac","802.11ax","802.11g"], a:2,
   why:"**802.11ax = Wi-Fi 6** (6E adds the 6 GHz band). 802.11n is Wi-Fi 4 and 802.11ac is Wi-Fi 5."}}
],
/* ------------------------------------------------------------------ n5 */
n5: [
 {tag:"every", h:"Shouting, a postman and customs",
  vis:{k:"steps", items:[["📢","A **hub** is like shouting in a maxi taxi: everyone hears every message"],["📮","A **switch** is a postman: it reads the name on the envelope and delivers to that one door"],["🛂","A **router** is customs at the border: it moves traffic **between** different networks and picks the route"]]}},
 {tag:"def", h:"The main network devices",
  vis:{k:"table", h:["Device","OSI layer","What it does","Uses"], rows:[["**Hub**","1","Repeats every signal out of every port","–"],["**Switch**","2","Sends each frame only to the port of the destination","MAC addresses"],["**Bridge**","2","Joins two LAN segments and filters traffic between them","MAC addresses"],["**Router**","3","Connects **different networks** and forwards packets on the best path","IP addresses"],["**Wireless access point**","2","Connects Wi-Fi devices to the wired network","MAC addresses"],["**Media converter**","1","Converts between media, e.g. fibre ↔ copper","–"]]}},
 {tag:"def", h:"A small office network",
  vis:{k:"net", h:245, n:[["i","🌐","Internet",170,20],["r","🛂","Router",170,80],["sw","🔀","Switch",170,145],["ap","📶","Access point",300,145],["a","💻","PC",40,200],["b","💻","PC",120,205],["c","🖨️","Printer",220,205],["ph","📱","Phone",300,205]], l:[["i","r"],["r","sw"],["sw","a"],["sw","b"],["sw","c"],["sw","ap"],["ap","ph","dash"]]},
  after:"The **switch** connects devices inside the LAN. The **router** connects the LAN to the internet (another network). The **access point** adds wireless."},
 {tag:"def", h:"How a switch learns",
  p:["A switch builds a **MAC address table**. Every time a frame arrives, it notes the **source** MAC address and the port it came in on. Then it looks up the **destination** MAC and sends the frame only out of that port.","If it doesn't know the destination yet, it **floods** the frame out of every other port, just once."],
  vis:{k:"table", h:["Port","MAC address learned"], rows:[["1","AA-11-22-33-44-01"],["2","AA-11-22-33-44-02"],["5","AA-11-22-33-44-05"]]},
  tricky:"Each switch port is its own **collision domain**. A router port separates **broadcast domains**: broadcasts don't pass through a router."},
 {tag:"def", h:"End devices",
  p:["**End devices** (hosts) are where data starts or finishes: PCs, laptops, phones, tablets, printers, servers, IP cameras, smart TVs, IP phones.","Everything in between that just passes data along (switches, routers, access points) is an **intermediary device**."]},
 {tag:"tricky", h:"Your home 'router' is four devices in one box",
  p:["The box from your internet provider is usually a **modem** (talks to the provider's line), a **router**, a small **switch** (the LAN ports) and a **wireless access point**, all combined."],
  tricky:"In exam answers, describe each **function** separately, even if one box does them all."},
 {tag:"mist", h:"Common mistakes",
  mist:[["'A switch uses IP addresses'","A (basic) switch forwards frames by MAC address.","Switch = layer 2 = MAC. Router = layer 3 = IP."],
   ["'Hubs and switches are the same'","A hub sends to every port; a switch sends only to the right one.","Hubs waste bandwidth and cause collisions; switches don't."],
   ["Using a router to join fibre to copper","That's a media converter's job.","Media converter = change the cable type."]]},
 {tag:"check", h:"Quick check",
  check:{q:"Which device connects the UTT network to the internet and chooses the path for each packet?", o:["Hub","Switch","Router","Media converter"], a:2,
   why:"Joining **different networks** and choosing the path by **IP address** is the **router's** job (layer 3)."}}
],
/* ------------------------------------------------------------------ n6 */
n6: [
 {tag:"every", h:"An address has a street and a house number",
  p:["A mailing address like *14 Frederick Street, Port of Spain* has a part everyone on the street shares, and a part that's just for one house.","An **IP address** is the same: a **network** part shared by everyone on that network, and a **host** part that identifies one device."],
  vis:{k:"scene", e:"🏘️", items:[["Network part","Like the street: same for every device on the LAN"],["Host part","Like the house number: unique to each device"],["Subnet mask","Shows where the street ends and the house number begins"]]}},
 {tag:"def", h:"IPv4 addresses",
  p:["An IPv4 address is **32 bits**, written as **4 octets** (8 bits each) in **dotted decimal**, e.g. `192.168.1.10`. Each octet is 0 to 255.","The **subnet mask** (e.g. `255.255.255.0`, or **/24**) marks which bits are network (the 1s) and which are host (the 0s)."],
  vis:{k:"ip", ip:"192.168.1.10", cidr:24}},
 {tag:"def", h:"Binary: the place values",
  p:["Each octet has 8 bits with these place values. Add the values where the bit is 1."],
  vis:{k:"bin", n:192}},
 {tag:"ex", h:"Worked example: 172 to binary",
  p:["Go left to right. If the place value fits into what's left, write 1 and subtract it; otherwise write 0.","172: 128 fits (44 left) → 1. 64 doesn't → 0. 32 fits (12 left) → 1. 16 no → 0. 8 fits (4 left) → 1. 4 fits (0 left) → 1. 2 no → 0. 1 no → 0."],
  vis:{k:"bin", n:172}},
 {tag:"def", h:"Address classes and special ranges",
  vis:{k:"table", h:["Class","First octet","Default mask","Private range"], rows:[["A","1 – 126","/8 (255.0.0.0)","10.0.0.0 – 10.255.255.255"],["B","128 – 191","/16 (255.255.0.0)","172.16.0.0 – 172.31.255.255"],["C","192 – 223","/24 (255.255.255.0)","192.168.0.0 – 192.168.255.255"],["D","224 – 239","–","Multicast"],["E","240 – 255","–","Experimental"]]},
  after:"**127.x.x.x** is **loopback** (127.0.0.1 = this computer). **169.254.x.x** is **APIPA**. **Private** addresses are used inside LANs and aren't routed on the internet."},
 {tag:"def", h:"How a device gets its address",
  p:["**Static**: typed in by hand. Used for servers, printers and routers that must never change.","**DHCP**: handed out automatically by a DHCP server, in four steps (**DORA**):"],
  vis:{k:"steps", items:[["📣","**D**iscover: the PC broadcasts 'Is there a DHCP server?'"],["🎁","**O**ffer: the server offers an address"],["🙋","**R**equest: the PC asks for that address"],["✅","**A**cknowledge: the server confirms; the PC gets the IP, mask, gateway and DNS"]]},
  after:"**APIPA**: if no DHCP server answers, Windows gives itself a **169.254.x.x** address. It can only talk to other APIPA devices, so no internet."},
 {tag:"def", h:"Subnet masks and CIDR",
  vis:{k:"table", h:["CIDR","Mask","Host bits","Usable hosts"], rows:[["/24","255.255.255.0","8","254"],["/25","255.255.255.128","7","126"],["/26","255.255.255.192","6","62"],["/27","255.255.255.224","5","30"],["/28","255.255.255.240","4","14"],["/29","255.255.255.248","3","6"],["/30","255.255.255.252","2","2"]]},
  after:"Usable hosts = **2ⁿ − 2**, where n is the number of host bits. You lose 2: the **network address** (all host bits 0) and the **broadcast address** (all host bits 1)."},
 {tag:"def", h:"Why subnet?",
  p:["**Subnetting** splits one big network into smaller ones. Think of UTT giving the labs, the staff and the Wi-Fi each their own subnet."],
  vis:{k:"steps", items:[["📉","Smaller **broadcast domains**, so less broadcast traffic"],["🔒","**Security**: control what can pass between subnets"],["🗂️","**Organisation**: easier to manage and troubleshoot"],["♻️","Less **wasted** addresses"]]}},
 {tag:"ex", h:"Worked example: 192.168.1.70/27",
  p:["1. /27 leaves **5 host bits**, so each subnet has 2⁵ = **32** addresses (the block size).","2. Subnets go up in 32s: 0, 32, **64**, 96… 70 falls in the one that starts at **64**.","3. Network = .64. The next subnet starts at .96, so broadcast = **.95**. Hosts are .65 to .94: **30** usable."],
  vis:{k:"ip", ip:"192.168.1.70", cidr:27}},
 {tag:"key", h:"The quick 'block size' method",
  vis:{k:"steps", items:[["1️⃣","Find the interesting octet of the mask (not 255 or 0)"],["2️⃣","Block size = **256 − that number** (e.g. 256 − 224 = 32)"],["3️⃣","Network address = the multiple of the block size at or below the address"],["4️⃣","Broadcast = next network address − 1"],["5️⃣","Usable hosts = everything in between"]]},
  vis2:{k:"ip", ip:"10.0.5.130", cidr:25}},
 {tag:"tricky", h:"Watch the edges",
  p:["The **network** and **broadcast** addresses can't be given to a device. That's why /24 has 256 addresses but only **254** usable hosts."],
  tricky:"Private class B is only **172.16 to 172.31**. 172.32.0.1 is a **public** address!"},
 {tag:"mist", h:"Common mistakes",
  mist:[["Forgetting the −2","/26 has 64 addresses, but only 62 usable.","Usable hosts = 2ⁿ − 2."],
   ["Using 2ⁿ with the network bits","For /27 it's the **host** bits (32 − 27 = 5) that count.","Host bits = 32 − prefix."],
   ["Thinking 169.254.x.x is a working address","It's APIPA: DHCP failed.","Check the DHCP server, the cable and the link, then `ipconfig /renew`."]]},
 {tag:"check", h:"Quick check",
  check:{q:"What is the network address of 192.168.5.100/26?", o:["192.168.5.0","192.168.5.64","192.168.5.96","192.168.5.128"], a:1,
   why:"/26 → block size 256 − 192 = **64**. Subnets start at 0, 64, 128… 100 is in the one starting at **.64**."}}
],
/* ------------------------------------------------------------------ n7 */
n7: [
 {tag:"every", h:"Your yard and the highway",
  p:["Your home LAN is like your own yard: you own it and control it. To get to San Fernando or Scarborough, you use **highways and the ferry** that someone else builds and runs.","A **WAN** is that highway system for data: it connects LANs that are far apart, usually over lines rented from a provider."],
  vis:{k:"net", h:210, n:[["isp","☁️","Provider",170,100],["pos","🏦","Port of Spain",60,35],["sf","🏦","San Fernando",60,175],["ar","🏦","Arima",280,35],["sc","🏦","Scarborough",280,175]], l:[["isp","pos"],["isp","sf"],["isp","ar"],["isp","sc"]], cap:"A bank's branches linked into one WAN"}},
 {tag:"def", h:"What is a WAN?",
  p:["A **wide area network** connects networks over a large geographic area: across a country, or the world. Organisations normally **lease** the connections from a **service provider** (telecoms company or ISP) instead of laying their own cables.","The **internet** is the biggest WAN of all."]},
 {tag:"def", h:"How WAN connections are made",
  vis:{k:"table", h:["Connection","How it works","Notes"], rows:[["**Leased line**","A dedicated private link between two sites","Reliable and secure, but expensive"],["**DSL**","Internet over telephone (copper) lines","Speed drops with distance from the exchange"],["**Cable**","Internet over the TV coaxial cable","Bandwidth is shared with neighbours"],["**Fibre (FTTH)**","Fibre optic right to the building","Very fast, long distance"],["**Cellular** (4G/5G)","Over the mobile phone network","Good where there are no cables"],["**Satellite**","Via a satellite in orbit","Reaches remote places; higher delay"],["**MPLS**","Provider's network carries traffic using labels","Common for linking company branches"]]}},
 {tag:"def", h:"The pieces at your end",
  vis:{k:"steps", items:[["🏢","**CPE** (customer premises equipment): your router and modem"],["📍","**Demarcation point** (demarc): where your responsibility ends and the provider's begins"],["🛣️","**Local loop** (last mile): the line from the demarc to the provider"],["🏭","The provider's **central office** and network carry it onwards"]]},
  after:"A **VPN** creates a secure, encrypted 'tunnel' across the public internet, so branches or home workers can connect privately without a leased line."},
 {tag:"def", h:"LAN vs WAN",
  vis:{k:"compare", cols:[{h:"LAN",items:["One building or site","Owned by the organisation","High speed, low cost per Mbps","Ethernet and Wi-Fi"]},{h:"WAN",items:["Cities, countries, the world","Usually leased from a provider","Slower and costs more per Mbps","Leased line, DSL, fibre, cellular, MPLS"]}]}},
 {tag:"tricky", h:"The router is the doorway",
  p:["The device that connects a LAN to a WAN is a **router**: it has a LAN interface on one side and a WAN interface on the other."],
  tricky:"A WAN isn't defined by speed or technology but by **distance and who owns the links**."},
 {tag:"mist", h:"Common mistakes",
  mist:[["'A WAN is just a big LAN'","WANs usually run over a provider's leased links, not the organisation's own cables.","Mention both: large geographic area **and** provider links."],
   ["Forgetting the internet is a WAN","It's the largest WAN, made of many networks.","LAN → MAN → WAN → the internet."],
   ["Mixing up the demarc and the CPE","The CPE is equipment; the demarc is a point (a boundary).","Demarc = where responsibility changes hands."]]},
 {tag:"check", h:"Quick check",
  check:{q:"A company links its offices in Port of Spain and San Fernando with a private, dedicated connection rented from a telecoms provider. What is this?", o:["A LAN","A peer-to-peer network","A leased line WAN","Bluetooth"], a:2,
   why:"Two distant sites + a **dedicated, rented** link = a **leased line**, which is a type of **WAN** connection."}}
],
/* ------------------------------------------------------------------ n8 */
n8: [
 {tag:"every", h:"Change the locks on a new house",
  p:["When you move into a new house, you change the locks, because the builder, the agent and the last owner may all still have keys.","New network devices arrive with **default passwords** that are printed in the manual and online for anyone to find. **Hardening** means locking the device down before you use it."],
  vis:{k:"scene", e:"🔐", items:[["Default password","Like the builder's spare key"],["Hardening","Changing the locks and closing the windows"],["Physical security","The gate, the burglar-proofing and the dog"]]}},
 {tag:"def", h:"Device hardening",
  p:["**Device hardening** reduces a device's **attack surface**: the number of ways in."],
  vis:{k:"table", h:["Do this","Why"], rows:[["**Change default passwords** (and usernames)","Defaults are published online"],["**Update the firmware**","Patches fix known security holes"],["**Disable unused services**","Every running service is another way in"],["**Disable unused switch ports**","Stops someone plugging into a spare wall jack"],["Use **secure protocols**: SSH, not Telnet; HTTPS, not HTTP","Telnet and HTTP send passwords as plain text"],["**Back up the configuration**","Quick recovery after a failure or attack"]]}},
 {tag:"def", h:"Disabling unused ports and services",
  p:["On a switch, shut down every port that nothing is plugged into, and you can use **port security** to allow only known MAC addresses on a port.","Turn off services you don't use: Telnet, unused web management, UPnP, WPS."],
  tricky:"**Telnet (port 23)** sends everything, including your password, as readable text. **SSH (port 22)** encrypts it. Always choose SSH."},
 {tag:"def", h:"Physical security",
  vis:{k:"steps", items:[["🚪","Keep switches, routers and servers in a **locked room or rack**"],["🪪","Control entry with **keys, key cards or badges**, and log who goes in"],["📹","**CCTV cameras** watch the equipment room"],["🔌","Lock or remove unused wall jacks; secure the **console port**"],["🌡️","Protect against heat and power cuts: air-conditioning and a **UPS**"]]}},
 {tag:"ex", h:"Worked example: hardening a lab switch",
  p:["A new switch arrives for a UTT lab. A good checklist:"],
  vis:{k:"steps", items:[["1️⃣","Change the default admin password; set a console password"],["2️⃣","Update to the latest firmware"],["3️⃣","Enable SSH and disable Telnet and HTTP management"],["4️⃣","Shut down the 10 ports that aren't in use"],["5️⃣","Turn on port security for the student desks"],["6️⃣","Mount it in the locked rack; back up the config"]]}},
 {tag:"tricky", h:"Physical access beats passwords",
  p:["Someone with their hands on a device can often reset it to factory settings through the console port or reset button, wiping out your passwords."],
  tricky:"That's why physical security is just as important as passwords: **lock the room**."},
 {tag:"mist", h:"Common mistakes",
  mist:[["Only changing the Wi-Fi password","The admin login is a different password.","Change the **admin** password too."],
   ["Leaving unused ports enabled","Anyone can plug in.","Shut down every unused port."],
   ["Managing devices with Telnet","Passwords travel as plain text.","Use SSH."]]},
 {tag:"check", h:"Quick check",
  check:{q:"Which is an example of PHYSICAL security?", o:["Changing the default password","Disabling Telnet","Keeping the switch in a locked rack","Updating firmware"], a:2,
   why:"A **locked rack** stops people touching the device. The others are device hardening (logical security)."}}
],

n9: [
 {tag:"every", h:"Think like a doctor",
  p:["A good doctor doesn't operate first and ask questions later. They ask about **symptoms**, think of a likely cause, run a **test**, give the **treatment**, check you're better, and write it in your **file**.","Network troubleshooting follows exactly the same steps."],

 {tag:"def", h:"Common problems and likely causes",

 {tag:"tricky", h:"Start at the bottom",

/* ------------------------------------------------------------------ c1 */
c1: [
 {tag:"every", h:"A PC is like a roti shop",
  p:["In a busy roti shop, the **cook** does the work, the **counter** holds what's being made right now, the **storeroom** keeps the flour and channa for later, and the **electricity** runs everything.","Inside a computer, each main part has a job just like that."],
  vis:{k:"table", h:["Roti shop","Computer part","Job"], rows:[["The cook","**CPU**","Carries out instructions: the 'brain'"],["The counter","**RAM**","Holds what's being worked on right now (wiped at power-off)"],["The storeroom","**Storage** (SSD/HDD)","Keeps files and programs, even with the power off"],["The shop building","**Motherboard**","Connects every part together"],["The electricity","**PSU**","Turns wall power into the power the parts need"]]}},
 {tag:"def", h:"The primary components",
  vis:{k:"board", hl:["cpu","dimm","pcie","m2","atx"], cap:"A motherboard with the main parts highlighted"},
  after:"Add a **graphics card (GPU)** for display (or use graphics built into the CPU), a **case** to hold it all, and **cooling** (fans, heatsinks) to keep it from overheating."},
 {tag:"def", h:"Identifying ports (interfaces)",
  vis:{k:"table", h:["Port","Looks like","Used for"], rows:[["**USB Type-A**","Flat rectangle","Keyboards, mice, flash drives"],["**USB Type-C**","Small oval, plugs in either way","Phones, chargers, docks, fast data"],["**HDMI**","Wide, slightly tapered","Digital video **and** audio to TVs and monitors"],["**DisplayPort**","One corner cut off, often a latch","Digital video and audio to PC monitors"],["**VGA**","Blue, 15 pins in 3 rows","Old **analogue** video"],["**DVI**","White, wide, many pins","Older digital (and sometimes analogue) video"],["**RJ45**","Square, a bit bigger than a phone jack","Wired network (Ethernet)"],["**3.5 mm audio**","Round, colour-coded","Green = speakers out, pink = mic in, blue = line in"],["**PS/2**","Round, 6 pins","Old keyboards (purple) and mice (green)"]]}},
 {tag:"tricky", h:"Same plug, different jobs",
  p:["A USB-C port might carry only USB data, or it might also do video (DisplayPort Alt Mode), charging or Thunderbolt. Look for the small logo beside the port (⚡ for Thunderbolt) or check the manual."],
  tricky:"VGA is the only common video port that is **analogue**. HDMI, DisplayPort and DVI-D are digital."},
 {tag:"mist", h:"Common mistakes",
  mist:[["'RAM stores my files'","RAM is wiped when the power goes off.","Files live in **storage** (SSD/HDD). RAM is working space."],
   ["Calling the case 'the CPU'","The CPU is one chip on the motherboard.","Call the box the **system unit** or **case**."],
   ["Plugging the mic into the green jack","Green is speakers/headphones out.","Mic = **pink**."]]},
 {tag:"check", h:"Quick check",
  check:{q:"Which port carries digital video AND audio and is on almost every TV?", o:["VGA","HDMI","PS/2","RJ45"], a:1,
   why:"**HDMI** carries both digital video and audio. VGA is analogue video only; PS/2 is keyboard/mouse; RJ45 is network."}}
],
/* ------------------------------------------------------------------ c2 */
c2: [
 {tag:"every", h:"The motherboard is the town's road network",
  p:["Every part plugs into the motherboard, and the motherboard's circuits (its **buses**) carry data between them, like roads connecting every house, shop and office in a town."],
  vis:{k:"board", cap:"Where everything plugs in"}},
 {tag:"def", h:"Use the manual!",
  p:["The **motherboard manual** (or the maker's website) tells you: which CPUs and RAM it supports, which slots to use first, where every header and connector is, what the **beep codes** and **diagnostic lights** mean, and how to update the BIOS."],
  tricky:"Before buying parts, check the manual's **CPU support list** and **memory support list (QVL)**."},
 {tag:"def", h:"Form factors",
  p:["The **form factor** is the board's size, shape and screw-hole layout. It must match the case."],
  vis:{k:"ff"}},
 {tag:"def", h:"Expansion slots",
  vis:{k:"table", h:["Slot","Lanes","Typical card"], rows:[["**PCIe x1**","1","Wi-Fi card, sound card, USB card"],["**PCIe x4**","4","NVMe adapter, fast network card"],["**PCIe x16**","16","**Graphics card**"],["**M.2**","up to 4 (NVMe)","SSD (sometimes Wi-Fi)"]]},
  after:"A **lane** is one pair of data paths. More lanes = more bandwidth. A smaller card (x1) will work in a bigger slot (x16), but not the other way round."},
 {tag:"def", h:"When it won't start: beeps and lights",
  p:["During **POST** the board checks the essential parts. If something fails before the screen works, it tells you with **beep codes** or **diagnostic LEDs** (often labelled CPU, DRAM, VGA, BOOT)."],
  vis:{k:"steps", items:[["🔊","Count the beeps (long and short)"],["📘","Look them up in **that board's manual**: codes differ between makers"],["💡","Or see which LED stays lit: DRAM → reseat the RAM; VGA → check the graphics card"],["🔧","Fix the part it points to, then try again"]]},
  tricky:"One short beep usually means POST passed. But there's no single universal code list, so always use the manual."},
 {tag:"mist", h:"Common mistakes",
  mist:[["Buying an ATX board for a mini-ITX case","It physically won't fit.","Match the board's form factor to the case."],
   ["Assuming 3 beeps means the same thing on every PC","Each BIOS maker has its own codes.","Check the manual for that board."],
   ["Forgetting the standoffs","The board can short against the metal case.","Screw in brass standoffs that line up with the board's holes."]]},
 {tag:"check", h:"Quick check",
  check:{q:"Which is the smallest of these form factors?", o:["ATX","Micro-ATX","Mini-ITX","They're all the same"], a:2,
   why:"**Mini-ITX** is 170 × 170 mm. Micro-ATX is 244 × 244 mm and ATX is 305 × 244 mm."}}
],
/* ------------------------------------------------------------------ c3 */
c3: [
 {tag:"every", h:"The CPU is the head cook",
  p:["The head cook reads each order, works out what it needs, and cooks it, over and over, very fast. A CPU does the same with instructions: **fetch, decode, execute**, billions of times a second."],
  vis:{k:"steps", items:[["📥","**Fetch** the next instruction from memory"],["🔍","**Decode**: work out what it means"],["⚙️","**Execute**: do it (calculate, compare, move data)"],["🔁","Repeat"]]}},
 {tag:"def", h:"What makes a CPU fast",
  vis:{k:"table", h:["Spec","Means"], rows:[["**Clock speed** (GHz)","Cycles per second: 3.5 GHz = 3.5 billion"],["**Cores**","Separate processors on one chip: more cores = more jobs at once"],["**Threads**","Tasks the cores can juggle; with hyper-threading/SMT, 1 core = 2 threads"],["**Cache** (L1, L2, L3)","Tiny, super-fast memory on the CPU itself"],["**Integrated graphics**","A GPU built into the CPU, so no graphics card is needed"]]}},
 {tag:"def", h:"Sockets: LGA vs PGA",
  vis:{k:"compare", cols:[{h:"LGA (land grid array)",items:["Pins are in the motherboard socket","CPU has flat pads ('lands')","Intel desktop CPUs; AMD AM5","Careful: bent socket pins = new board"]},{h:"PGA (pin grid array)",items:["Pins are on the CPU","Socket has holes","Older AMD, e.g. AM4","Careful: bent CPU pins"]}]},
  tricky:"The CPU must match the board's socket exactly (e.g. LGA1700, AM5). A CPU for one socket won't fit another."},
 {tag:"def", h:"Keeping it cool",
  vis:{k:"table", h:["Cooling","How","Good for"], rows:[["**Air cooler**","Metal heatsink with fins + fan","Most PCs; cheap, reliable"],["**Liquid (AIO)**","Pump moves liquid to a radiator with fans","Hot, high-end CPUs; quieter"],["**Passive**","Heatsink only, no fan","Low-power devices"]]},
  after:"**Thermal paste** fills tiny air gaps between the CPU and cooler so heat flows into the cooler. A **pea-sized** dot is enough."},
 {tag:"ex", h:"Worked example: installing a CPU",
  vis:{k:"steps", items:[["🖐️","Unplug the PC; wear an **anti-static (ESD) strap**"],["🔓","Lift the socket's retention lever"],["🔺","Line up the **triangle/arrow** on the CPU with the one on the socket"],["⬇️","Lower it in gently: **no force** (zero insertion force)"],["🔒","Close the lever"],["🧴","Pea-sized thermal paste, then mount the cooler evenly"],["🔌","Plug the cooler fan into the **CPU_FAN** header"]]}},
 {tag:"mist", h:"Common mistakes",
  mist:[["Pushing the CPU in hard","Pins bend.","Align the triangle and let it drop in."],
   ["No thermal paste, or a huge blob","Too little overheats; too much makes a mess.","Pea-sized dot in the centre."],
   ["Forgetting the CPU fan cable","The board may refuse to boot or the CPU overheats.","Plug it into CPU_FAN."]]},
 {tag:"check", h:"Quick check",
  check:{q:"On an LGA CPU, where are the pins?", o:["On the CPU","In the motherboard socket","On the cooler","There are no pins anywhere"], a:1,
   why:"**LGA**: pins in the **socket**, flat lands on the CPU. PGA is the opposite."}}
],
/* ------------------------------------------------------------------ c4 */
c4: [
 {tag:"every", h:"RAM is your desk",
  p:["Your **desk** holds what you're working on right now; the **filing cabinet** holds everything else. A bigger desk lets you spread out more work at once.","**RAM** is the desk; **storage** is the cabinet. And at the end of the day (power off), the desk is cleared."]},
 {tag:"def", h:"DDR generations",
  vis:{k:"table", h:["Type","Voltage","Pins (desktop DIMM)","Example speed"], rows:[["DDR3","1.5 V","240","DDR3-1600"],["DDR4","1.2 V","288","DDR4-3200"],["DDR5","1.1 V","288","DDR5-4800 and up"]]},
  tricky:"Each generation has its **notch in a different place**, so they can't be swapped. Laptops use the smaller **SO-DIMM**."},
 {tag:"def", h:"Reading a RAM label",
  p:["**DDR4-3200** means 3,200 million transfers per second. Each transfer moves 8 bytes (64 bits), so the bandwidth is 3200 × 8 = **25,600 MB/s**, which is why it's also called **PC4-25600**."],
  after:"**Dual channel**: put matching sticks in the slots the manual says (often the same colour) so the CPU can use two at once, nearly doubling bandwidth."},
 {tag:"def", h:"How much RAM can you use?",
  p:["A **32-bit** OS can address 2³² bytes = **4 GB**, so it can't use more than about 4 GB. A **64-bit** OS can use far more.","When RAM fills up, Windows borrows space on the drive called **virtual memory** (the **page file**). It works, but it's much slower than real RAM."],
  tricky:"If a PC is slow and the drive light is busy while RAM shows nearly 100% in Task Manager, it's **paging**: add more RAM."},
 {tag:"ex", h:"Installing RAM",
  vis:{k:"steps", items:[["🖐️","Power off, unplug, ESD strap"],["📘","Check the manual for which slots to fill first"],["🔓","Open the slot clips"],["🔑","Line up the **notch** with the key in the slot"],["⬇️","Press down firmly at both ends until the clips snap"],["✅","Boot and check the total in the BIOS or Settings"]]}},
 {tag:"mist", h:"Common mistakes",
  mist:[["Forcing DDR4 into a DDR5 slot","The notch is in a different place.","Match the generation the board supports."],
   ["Installing 16 GB on a 32-bit OS","It can only use about 4 GB.","Install a 64-bit OS."],
   ["Thinking virtual memory = more RAM","It's on the drive and much slower.","It's a backup, not a replacement."]]},
 {tag:"check", h:"Quick check",
  check:{q:"What is the bandwidth of DDR4-2400?", o:["2,400 MB/s","19,200 MB/s","24,000 MB/s","4,800 MB/s"], a:1,
   why:"2400 × 8 bytes = **19,200 MB/s** (PC4-19200)."}}
],
/* ------------------------------------------------------------------ c5 */
c5: [
 {tag:"every", h:"The security guard who checks before opening",
  p:["Before a mall opens, the guard walks round: lights on? doors working? alarms OK? Only then do the shops open.","When you press the power button, **firmware** does the same checks (**POST**), then hands over to Windows."]},
 {tag:"def", h:"BIOS and UEFI",
  vis:{k:"compare", cols:[{h:"BIOS (legacy)",items:["Older firmware","Text-only screens, keyboard only","Boots MBR drives (max 2 TB)","No Secure Boot"]},{h:"UEFI (modern)",items:["Replaces BIOS on new PCs","Graphical, mouse works","Boots GPT drives over 2 TB","Secure Boot, faster start-up"]}]},
  after:"People still say 'BIOS' even when they mean UEFI."},
 {tag:"def", h:"POST and CMOS",
  vis:{k:"steps", items:[["⚡","Power on"],["🔎","**POST** (Power-On Self-Test) checks CPU, RAM, graphics"],["💾","Settings are read from **CMOS** memory (kept alive by a coin battery, usually CR2032)"],["🚀","The firmware finds a boot device and starts the OS"]]},
  tricky:"Wrong date and time every time the PC is unplugged = a dead **CMOS battery**."},
 {tag:"def", h:"Getting into setup",
  p:["Press the setup key straight after power-on: often **Delete** or **F2** (it depends on the maker; the screen usually says). From Windows you can also restart into UEFI settings."],
  vis:{k:"table", h:["Setting","Why change it"], rows:[["**Boot order**","Boot from a USB to install an OS"],["**Date and time**","Keep the clock right"],["**Virtualization** (VT-x / AMD-V)","Needed for virtual machines"],["**Secure Boot / TPM**","Needed for Windows 11"],["**Admin (supervisor) password**","Stop others changing settings"],["**Fan curves, XMP/EXPO**","Cooling and RAM speed"]]}},
 {tag:"def", h:"Troubleshooting firmware",
  vis:{k:"steps", items:[["🔁","Settings changed and it won't boot? **Load defaults** in setup"],["🧷","Can't get in at all? **Clear CMOS** (jumper or remove the battery for a minute, with power unplugged)"],["⬆️","Bugs or new CPU support? **Update (flash)** the firmware from the maker's site; never cut the power during a flash"]]}},
 {tag:"mist", h:"Common mistakes",
  mist:[["'CMOS is the battery'","CMOS is the memory that holds settings; the battery keeps it powered.","Battery → keeps CMOS settings and clock alive."],
   ["Flashing the BIOS during a storm","A power cut mid-flash can leave the board unbootable.","Use a UPS; don't flash unless needed."],
   ["Expecting the same setup key on every PC","Makers use different keys.","Watch the start-up screen or check the manual."]]},
 {tag:"check", h:"Quick check",
  check:{q:"Which needs UEFI rather than legacy BIOS?", o:["Booting from a 4 TB GPT drive with Secure Boot","Using a keyboard","Running POST","Keeping the date"], a:0,
   why:"Booting from **GPT drives over 2 TB** and **Secure Boot** are UEFI features."}}
],
/* ------------------------------------------------------------------ c6 */
c6: [
 {tag:"every", h:"From T&TEC to the CPU",
  p:["The wall socket gives **AC** at about **115 V** in Trinidad and Tobago. Computer parts need small, steady **DC** voltages. The **power supply unit (PSU)** converts one into the other."],
  vis:{k:"steps", items:[["🔌","Wall: AC, ~115 V, 60 Hz"],["📦","PSU converts and steadies it"],["⚡","Out: DC at **12 V**, **5 V** and **3.3 V**"]]}},
 {tag:"def", h:"The rails and connectors",
  vis:{k:"table", h:["Connector","Goes to"], rows:[["**24-pin ATX**","Motherboard (main power)"],["**4/8-pin EPS** (CPU)","Motherboard near the CPU"],["**6 or 6+2-pin PCIe**","Graphics card (12VHPWR 16-pin on some new cards)"],["**SATA power** (15-pin, flat)","SSDs, hard drives, optical drives"],["**Molex** (4-pin)","Older drives and fans"]]},
  after:"The **12 V** rail does the heavy work (CPU and GPU). 5 V and 3.3 V feed smaller loads like drives, USB and chips."},
 {tag:"def", h:"How many watts?",
  p:["Add up what the parts draw, then add about **20–30% headroom**. A PC with a 125 W CPU, a 200 W graphics card and about 75 W for everything else needs ~400 W, so choose a **500–550 W** PSU."],
  vis:{k:"table", h:["80 PLUS rating","Efficiency at 50% load (115 V)"], rows:[["White (standard)","80%"],["Bronze","85%"],["Silver","88%"],["Gold","90%"],["Platinum","92%"],["Titanium","94%"]]},
  tricky:"Efficiency = power **out** ÷ power **in**. A 90% efficient PSU giving 450 W draws 450 ÷ 0.9 = **500 W** from the wall; the extra 50 W becomes heat."},
 {tag:"def", h:"Modular or not?",
  vis:{k:"compare", cols:[{h:"Non-modular",items:["All cables fixed","Cheapest","Unused cables clutter the case"]},{h:"Semi-modular",items:["Main 24-pin and CPU fixed","Others detachable"]},{h:"Fully modular",items:["Every cable detachable","Neatest airflow and cable management","Costs most"]}]}},
 {tag:"tricky", h:"Safety first",
  p:["**Never open a PSU.** Its capacitors can hold a dangerous charge even after unplugging. A faulty PSU is replaced, not repaired."],
  tricky:"Signs of a failing PSU: random shutdowns or restarts, PC dead with no lights or fans, burning smell, loud whine. Test with a **PSU tester** or **multimeter**, or swap in a known good PSU."},
 {tag:"mist", h:"Common mistakes",
  mist:[["Buying exactly the wattage you add up","No room for load spikes or ageing.","Add 20–30% headroom."],
   ["Forgetting the 8-pin CPU cable","The PC won't POST.","Connect both the 24-pin and the CPU power."],
   ["Thinking 'Gold' means more watts","80 PLUS is about efficiency, not size.","Wattage and efficiency are separate."]]},
 {tag:"check", h:"Quick check",
  check:{q:"A PSU delivers 400 W to the parts at 80% efficiency. How much does it draw from the wall?", o:["320 W","400 W","480 W","500 W"], a:3,
   why:"Input = output ÷ efficiency = 400 ÷ 0.8 = **500 W**."}}
],
/* ------------------------------------------------------------------ c7 */
c7: [
 {tag:"every", h:"A record player vs a USB stick",
  p:["A **hard disk drive (HDD)** is like a record player: spinning platters with an arm that moves to the right spot. A **solid-state drive (SSD)** is like a giant USB stick: no moving parts, so it's far faster and survives bumps."]},
 {tag:"def", h:"HDD vs SSD",
  vis:{k:"table", h:["","HDD","SATA SSD","NVMe SSD"], rows:[["How","Spinning magnetic platters (5400/7200 RPM)","Flash memory","Flash memory on PCIe"],["Speed (approx.)","100–200 MB/s","up to ~550 MB/s","thousands of MB/s"],["Shape","3.5\" or 2.5\"","2.5\" or M.2","M.2 (or PCIe card)"],["Good for","Cheap, huge storage","Upgrading old PCs","Fastest boot and load times"]]},
  tricky:"**M.2** is a *shape*, not a speed. An M.2 drive can be SATA or NVMe; check the board supports the type."},
 {tag:"def", h:"Removable media",
  vis:{k:"table", h:["Media","Typical capacity"], rows:[["USB flash drive","8 GB – 1 TB+"],["SD / microSD card","up to 1 TB+ (cameras, phones)"],["CD","700 MB"],["DVD","4.7 GB (8.5 GB dual layer)"],["Blu-ray","25 GB (50 GB dual layer)"],["External HDD/SSD","1 TB – several TB"]]}},
 {tag:"def", h:"RAID: several drives working as one",
  vis:{k:"raid", level:0}, vis2:{k:"raid", level:1}},
 {tag:"def", h:"RAID 5 and RAID 10",
  vis:{k:"raid", level:5}, vis2:{k:"raid", level:10},
  tricky:"**RAID is not a backup.** If you delete a file or get ransomware, RAID copies the damage to every disk instantly."},
 {tag:"def", h:"Avoiding data loss",
  vis:{k:"steps", items:[["3️⃣","**3-2-1 backup rule**: 3 copies of your data"],["2️⃣","on 2 different types of media"],["1️⃣","with 1 copy off-site (or in the cloud)"]]},
  after:"Warning signs a drive is failing: **clicking** noises (HDD), very slow file access, S.M.A.R.T. errors, files that won't open. **Back up first**, then investigate."},
 {tag:"mist", h:"Common mistakes",
  mist:[["'RAID 0 protects my data'","It has no redundancy: one failure loses everything.","RAID 0 = speed only."],
   ["'I have RAID 1, so no backup'","Deletes and viruses are mirrored too.","Keep separate backups."],
   ["Buying an NVMe drive for a SATA-only M.2 slot","It won't be detected.","Check the manual for the slot type."]]},
 {tag:"check", h:"Quick check",
  check:{q:"RAID 5 with four 2 TB drives. How much usable space?", o:["2 TB","4 TB","6 TB","8 TB"], a:2,
   why:"RAID 5 usable = (disks − 1) × size = 3 × 2 TB = **6 TB**. One disk's worth is used for parity."}}
],
/* ------------------------------------------------------------------ c8 */
c8: [
 {tag:"every", h:"One plug to rule them all?",
  p:["Remember when every phone had a different charger? **USB** set out to fix that: one standard connector for keyboards, drives, phones and more. Today **USB-C** charges phones, laptops and even monitors."]},
 {tag:"def", h:"USB speeds",
  vis:{k:"table", h:["Version","Speed","Notes"], rows:[["USB 1.1","12 Mbps","Very old"],["USB 2.0","480 Mbps","Often black ports"],["USB 3.2 Gen 1 (was USB 3.0)","5 Gbps","Often blue ports"],["USB 3.2 Gen 2","10 Gbps",""],["USB 3.2 Gen 2x2","20 Gbps","USB-C only"],["USB4","40 Gbps (v2: 80)","USB-C only"]]},
  tricky:"Speed depends on the port, the cable **and** the device: the slowest one wins."},
 {tag:"def", h:"Connectors",
  vis:{k:"table", h:["Connector","Where you see it"], rows:[["**Type-A**","PCs, chargers, flash drives"],["**Type-B**","Printers and scanners (square)"],["**Mini-USB**","Old cameras"],["**Micro-USB**","Older Android phones"],["**Type-C**","Modern phones, laptops: reversible"]]}},
 {tag:"def", h:"Thunderbolt and Lightning",
  vis:{k:"table", h:["","Thunderbolt","Lightning"], rows:[["Made by","Intel (with Apple)","Apple"],["Connector","USB-C (Thunderbolt 3, 4, 5)","Its own small 8-pin reversible plug"],["Speed","40 Gbps (Thunderbolt 5: 80 Gbps)","USB 2.0 speed on most devices"],["Used for","Docks, fast external drives, monitors","Older iPhones and iPads (iPhone 15 moved to USB-C)"]]}},
 {tag:"def", h:"Other peripherals",
  vis:{k:"table", h:["Device","Key facts"], rows:[["**Scanner**","Flatbed, sheet-fed or ADF (automatic document feeder); resolution in **DPI**"],["**Card reader**","Reads SD/microSD cards"],["**Webcam**","720p/1080p/4K, built-in mic, privacy shutter; needs good light for video calls"],["**Optical drive**","Reads/writes CD, DVD, Blu-ray"],["**Headset**","USB, 3.5 mm or Bluetooth; check mic levels in Sound settings"]]}},
 {tag:"ex", h:"Installing an expansion card",
  vis:{k:"steps", items:[["🖐️","Power off, unplug, ESD strap"],["🔩","Remove the slot cover on the back of the case"],["⬇️","Press the card firmly into the right PCIe slot"],["🔩","Screw the bracket to the case"],["🔌","Connect any power it needs"],["💿","Boot and install the **driver**; check Device Manager"]]},
  after:"Card not working? Reseat it, try another slot, look for a ⚠️ in **Device Manager**, update or roll back the driver."},
 {tag:"mist", h:"Common mistakes",
  mist:[["'Every USB-C port is Thunderbolt'","USB-C is just the plug shape.","Look for the ⚡ logo."],
   ["Blaming the device when the cable is USB 2.0","The cable limits speed.","Use a cable rated for the speed."],
   ["Skipping the driver","Windows may not use the card's features.","Install the maker's driver."]]},
 {tag:"check", h:"Quick check",
  check:{q:"What's the maximum speed of USB 2.0?", o:["12 Mbps","480 Mbps","5 Gbps","40 Gbps"], a:1,
   why:"USB 2.0 = **480 Mbps**. 5 Gbps is USB 3.2 Gen 1; 40 Gbps is USB4/Thunderbolt."}}
],
/* ------------------------------------------------------------------ c9 */
c9: [
 {tag:"every", h:"A picture made of tiny tiles",
  p:["Look very closely at a screen and you'll see tiny dots called **pixels**, like the tiles in a mosaic. More tiles = a sharper picture. That's **resolution**."]},
 {tag:"def", h:"Monitor technologies",
  vis:{k:"table", h:["Type","How","Strengths"], rows:[["**LCD (LED-backlit)**: TN","Liquid crystals + backlight","Cheap, fast response; weaker colours and angles"],["LCD: **IPS**","Liquid crystals + backlight","Best colours and viewing angles"],["LCD: **VA**","Liquid crystals + backlight","Deep blacks, high contrast"],["**OLED**","Each pixel makes its own light","Perfect black; risk of burn-in"]]},
  after:"Other specs: **refresh rate** (Hz: how many times a second the picture updates) and **response time** (ms: how fast a pixel changes colour)."},
 {tag:"def", h:"Resolutions and aspect ratios",
  vis:{k:"table", h:["Name","Resolution","Pixels"], rows:[["HD (720p)","1280 × 720","921,600"],["Full HD (1080p)","1920 × 1080","2,073,600"],["QHD (1440p)","2560 × 1440","3,686,400"],["4K UHD","3840 × 2160","8,294,400"]]},
  after:"**Aspect ratio** = width : height. All of these are **16:9**. Others: 16:10, 21:9 (ultrawide), 4:3 (old monitors and projectors). 4K has exactly 4 times the pixels of 1080p."},
 {tag:"def", h:"Graphics cards and connections",
  p:["**Integrated graphics** are built into the CPU and share the RAM. A **dedicated graphics card (GPU)** has its own fast memory (VRAM) for games, video editing and AI."],
  vis:{k:"table", h:["Port","Signal","Audio?"], rows:[["VGA","Analogue","No"],["DVI","Digital (DVI-I also analogue)","No"],["HDMI","Digital","Yes"],["DisplayPort","Digital","Yes"],["USB-C (DP Alt Mode)","Digital","Yes"]]}},
 {tag:"ex", h:"Installing a graphics card",
  vis:{k:"steps", items:[["🧹","Uninstall the old driver (if replacing a card)"],["🖐️","Power off, unplug, ESD strap"],["⬇️","Seat the card in the top **PCIe x16** slot until the latch clicks; screw it in"],["🔌","Connect the **PCIe power** cables from the PSU"],["🖥️","Plug the monitor into the **card**, not the motherboard"],["💿","Install the latest driver from the GPU maker"]]},
  tricky:"No picture after installing? The monitor is probably still plugged into the motherboard's video port."},
 {tag:"def", h:"More than one screen",
  p:["Press **Windows + P** to choose: **Duplicate** (same picture on both, good for presenting) or **Extend** (one big desktop across both). Set positions in Display settings."],
  after:"**Projectors**: brightness is measured in **lumens** (higher for bright rooms). **Keystone** correction fixes a trapezoid-shaped picture."},
 {tag:"mist", h:"Common mistakes",

/* =================== STATE =================== */
const KEY = "utt.coach.v1";
const DEF = () => ({v:1,name:"",role:null,xp:0,coins:0,days:{},streak:0,best:0,last:null,
  topics:{},mistakes:[],srs:{},log:[],quizLog:[],badges:{},beepOK:{},
  n:{quiz:0,perfect:0,daily:0,tutor:0,structured:0,lesson:0,visual:0,photo:0,review:0,subnet:0,trace:0},
  games:{},daily:null,dailyQ:null,lastTopic:null,subj:"ntwk",lessonDay:{},
  owned:{},theme:null,look:"auto",avatar:null,coachStyle:null,freezes:0,chestDay:null,
  parent:{pin:null,rewards:[]},shopTab:"theme",claimed:{},cloud:null,pendXP:0,pendBase:null,created:null});
let S = DEF();
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(DEF(), JSON.parse(raw)); }catch(e){}
S.n = Object.assign(DEF().n, S.n||{});

const pad = n => String(n).padStart(2,"0");
const dstr = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dstr(new Date());
const addDays = (k) => { const d=new Date(); d.setDate(d.getDate()+k); return dstr(d); };
function gapDays(a){ if(!a) return 999; const [y,m,d]=a.split("-").map(Number); const t=new Date(); const x=new Date(y,m-1,d); t.setHours(0,0,0,0); return Math.round((t-x)/86400000); }

/* ---- save: this device, plus the cloud backup (main app) or Claude's storage (Coach) ---- */
let cloudDoc = null, saveT = null, syncT = null, dirty = false, lastSync = null, syncErr = false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(cloudDoc){ clearTimeout(saveT); saveT = setTimeout(()=>{ cloudDoc.set({state:JSON.stringify(S), xp:S.xp, at:Date.now()}).catch(()=>{}); }, 1500); }
  if(canSync()){ dirty = true; clearTimeout(syncT); syncT = setTimeout(syncNow, 5000); }
}
function canSync(){ return STANDALONE && /^https?:/.test(location.protocol) && S.role!=="parent" && !!S.name && !!S.cloud?.code; }
const CODE_ABC = "abcdefghjkmnpqrstuvwxyz23456789";
function newCode(){ const b = new Uint8Array(16); crypto.getRandomValues(b); return [...b].map(x=>CODE_ABC[x % CODE_ABC.length]).join(""); }
const fmtCode = c => (c||"").replace(/(.{4})(?=.)/g,"$1-");
/* ---- two-way sync: every device using the same code shares one progress ----
   Each device keeps a copy of the last state it agreed with the cloud ("base").
   On sync it pulls the cloud copy, merges in only what changed here since the base,
   then pushes the result. Counters add up, lists are joined, settings: newest change wins. */
const BASE_KEY = KEY+".base";
const LOCAL_ONLY = ["cloud","movedTo","shopTab","filter","map","find","pendXP","pendBase"];
const jeq = (a,b) => JSON.stringify(a)===JSON.stringify(b);
const isObj = x => x && typeof x==="object" && !Array.isArray(x);
function addN(l,r,b){ return Math.max(0, (+r||0) + (+l||0) - (+b||0)); }
function mergeMap(l,r,b,each){ l=l||{}; r=r||{}; b=b||{}; const o={};
  for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
    const v = each ? each(l[k],r[k],b[k],k) : (jeq(l[k],b[k]) ? r[k] : l[k]);
    if(v!==undefined) o[k]=v; }
  return o; }
function pick3(l,r,b){ return jeq(l,b) ? r : l; }
function joinLog(l,r){ const seen=new Set(), out=[];
  for(const e of [...(r||[]),...(l||[])]){ const k=e.at+"|"+(e.q||e.title||""); if(!seen.has(k)){ seen.add(k); out.push(e); } }
  return out.sort((x,y)=>x.at<y.at?-1:x.at>y.at?1:0); }
function mergeTopic(l,r,b){ if(!l) return r; if(!r) return l; b=b||{};
  const o = Object.assign({}, r);
  for(const k of ["att","ok","time","lessons","wrong","quiz"]) o[k]=addN(l[k],r[k],b[k]);
  o.best=Math.max(l.best||0, r.best||0); o.last=[l.last,r.last].filter(Boolean).sort().pop()||null;
  o.recent = jeq(l.recent,b.recent) ? r.recent : l.recent; return o; }
function mergeState(L,R,B){
  B=B||{}; const M={};
  for(const k of new Set([...Object.keys(L),...Object.keys(R)])){
    const l=L[k], r=R[k], b=B[k];
    if(LOCAL_ONLY.includes(k)) M[k]=l;
    else if(["xp","coins"].includes(k)) M[k]=addN(l,r,b);
    else if(k==="freezes") M[k]=Math.min(2, addN(l,r,b));
    else if(k==="n") M[k]=mergeMap(l,r,b,(x,y,z)=>addN(x,y,z));
    else if(k==="days") M[k]=mergeMap(l,r,b,(x,y,z)=>addN(x,y,z)||undefined);
    else if(k==="topics") M[k]=mergeMap(l,r,b,mergeTopic);
    else if(k==="log"||k==="quizLog") M[k]=joinLog(l,r);
    else if(k==="games") M[k]=mergeMap(l,r,b,(x,y)=>Math.max(x||0,y||0)||undefined);
    else if(["badges","owned","claimed","beepOK","lessonsDone"].includes(k)) M[k]=mergeMap(l,r,{},(x,y)=>x===undefined?y:y===undefined?x:(x<y?x:y));
    else if(k==="lessonDay"||k==="lessonPos") M[k]=mergeMap(l,r,b,(x,y)=>x===undefined?y:y===undefined?x:(x>y?x:y));
    else if(k==="srs") M[k]=mergeMap(l,r,b);
    else if(k==="mistakes"){ const ix=a=>Object.fromEntries((a||[]).map(m=>[m.id,m]));
      M[k]=Object.values(mergeMap(ix(l),ix(r),ix(b))).sort((x,y)=>(y.d||"").localeCompare(x.d||"")).slice(0,60); }
    else if(k==="best") M[k]=Math.max(l||0,r||0);
    else if(k==="chestDay") M[k]=[l,r].filter(Boolean).sort().pop()||null;
    else if(k==="created") M[k]=[l,r].filter(Boolean).sort()[0]||null;
    else if(k==="last"||k==="streak") continue;
    else M[k]=pick3(l,r,b);
  }
  /* the streak belongs to whichever device studied most recently */
  const lw = (L.last||"") > (R.last||"") || ((L.last||"")===(R.last||"") && (L.streak||0)>=(R.streak||0));
  M.last = lw ? L.last : R.last; M.streak = lw ? L.streak : R.streak;
  M.best = Math.max(M.best||0, M.streak||0);
  /* a badge or level reached on both devices before they synced only pays its coins once */
  const bb=B.badges||{}, rb=R.badges||{}; let dup=0;
  for(const k in (L.badges||{})) if(rb[k] && !bb[k]) dup+=25;
  if(B.xp!==undefined) dup += 50*Math.max(0, Math.min(levelOf(L.xp||0), levelOf(R.xp||0)) - levelOf(B.xp||0));
  if(M.coins!==undefined) M.coins = Math.max(0, M.coins - dup);
  return Object.assign(DEF(), M, {n:Object.assign(DEF().n, M.n||{})});
}
function loadBase(){ try{ return JSON.parse(localStorage.getItem(BASE_KEY)||"null"); }catch(e){ return null; } }
function saveBase(st){ try{ localStorage.setItem(BASE_KEY, JSON.stringify(st)); }catch(e){} }
let syncing = false;
async function syncNow(opts={}){
  if(!canSync() || syncing) return;
  if(!dirty && !opts.pull) return;
  syncing = true; clearTimeout(syncT);
  try{
    let remote = await pullCloud(S.cloud.code), base = loadBase();
    /* this code was linked into another one: follow it, carrying over what changed here */
    for(let hop=0; hop<3 && remote && remote.movedTo && remote.movedTo!==S.cloud.code; hop++){
      base = base || remote; const to = remote.movedTo;
      remote = await pullCloud(to); S.cloud = Object.assign({}, S.cloud, {code:to, was:S.cloud.code}); dirty = true;
    }
    const before = JSON.stringify(S);
    /* no base yet (first sync after this update): the cloud copy came from this device, so it is the base */
    let merged = remote ? mergeState(S, remote, base || remote) : S;
    const changedHere = !jeq(merged, S);
    const needPush = dirty || !remote || !jeq(merged, remote);
    dirty = false;
    if(changedHere){ S = merged; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
    const snap = JSON.stringify(S);
    if(needPush){
      const r = await fetch("/api/backup/"+S.cloud.code, {method:"PUT", keepalive:true, headers:{"content-type":"application/json"}, body:JSON.stringify({state:JSON.parse(snap), at:new Date().toISOString()})});
      if(r.status===409){ clearTimeout(syncT); syncT = setTimeout(()=>syncNow({pull:true}), 1500); }
      if(!r.ok) throw 0;
    }
    try{ localStorage.setItem(BASE_KEY, snap); }catch(e){} lastSync = new Date(); syncErr = false;
    if(changedHere && JSON.stringify(S)!==before) afterSyncChange();
  }catch(e){ dirty = true; syncErr = true; }
  syncing = false;
}
/* link this device to another device's code: both histories are added together */
async function linkDevice(raw){
  let code = String(raw||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!/^[a-z2-9]{16}$/.test(code)){ toast("That code should be 16 letters and numbers."); return; }
  if(code===S.cloud?.code){ toast("This device already uses that code."); return; }
  try{
    await syncNow();
    let remote = await pullCloud(code);
    for(let hop=0; hop<3 && remote && remote.movedTo; hop++){ code = remote.movedTo; remote = await pullCloud(code); }
    if(!remote){ toast("No backup found for that code."); return; }
    const old = S.cloud?.code;
    if(code===old){ toast("This device already uses that code."); return; }
    /* leave a note on the old code so any other device still using it follows along */
    if(old){ const stub = Object.assign({}, loadBase() || S, {movedTo:code});
      await fetch("/api/backup/"+old, {method:"PUT", headers:{"content-type":"application/json"}, body:JSON.stringify({state:stub})}).catch(()=>{}); }
    S = mergeState(S, remote, {}); S.cloud = {code, since:today(), was:old};
    try{ localStorage.setItem(KEY, JSON.stringify(S)); localStorage.removeItem(BASE_KEY); }catch(e){}
    dirty = true; await syncNow({pull:true});
    if(syncErr) toast("Linked, but couldn't upload yet. It will retry with internet.");
    else toast("Linked! This device now shares progress with your other device.", true);
    applyTheme(); render();
  }catch(e){ toast("Couldn't reach the backup. Check your internet and try again."); }
}

}
async function pullCloud(code){
  const r = await fetch("/api/backup/"+code, {cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("net");
  const j = await r.json(); return j && j.state ? j.state : null;
}
async function initCloud(){
  if(COACH_MODE){
    try{
      if(!window.claude?.use) return;
      const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if(!db || !user) return;
      const id = await user.id(); if(!id) return;
      cloudDoc = db.collection("data/users/"+id).doc("coach");
      const snap = await cloudDoc.get();
      if(snap.exists){
        const remote = JSON.parse(snap.data().state || "{}");
        const keepPend = S.pendXP||0;
        if(!S.name && remote.name || (remote.pendXP||0) > keepPend){ S = Object.assign(DEF(), remote); S.n = Object.assign(DEF().n, S.n||{}); try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){} render(); }
      } else if(S.name) save();
    }catch(e){}
    return;
  }
  if(!/^https?:/.test(location.protocol) || S.role==="parent" || !S.name) return;
  if(!S.cloud?.code){ S.cloud = {code:newCode(), since:today()}; dirty = true; save(); }
  await syncNow({pull:true});
}

/* =================== LEVELS, XP, STREAKS =================== */
function liveStreak(){ const g=gapDays(S.last); return g<=1 || (g-1)<=(S.freezes||0) ? S.streak : 0; }
function levelOf(xp){ let L=1; while(50*L*(L+1) <= xp) L++; return L; }
function levelFloor(L){ return 50*(L-1)*L; }
function levelName(L){ return LEVELS[Math.min(L-1, LEVELS.length-1)]; }

function addXP(n, why){
  n = Math.round(n); if(n<=0) return;
  if(COACH_MODE){ S.pendXP=(S.pendXP||0)+n; save(); renderHeader(); toast(`+${n} XP · tap "Add XP to app" when you're done`); return; }
  const before = levelOf(S.xp);
  S.xp += n; S.coins += n;
  const t = today(); const prevDay = S.days[t]||0; S.days[t] = prevDay + n;
  if(S.last !== t){ const g=gapDays(S.last);
    if(g===1) S.streak++;
    else if(g>1 && g<900 && (g-1)<=(S.freezes||0)){ S.freezes-=(g-1); S.streak++; setTimeout(()=>toast(`A streak freeze saved your ${S.streak-1}-day streak!`, true),1200); }
    else S.streak = 1;
    S.last = t; S.best = Math.max(S.best, S.streak); }
  const after = levelOf(S.xp);
  if(after>before){ S.coins += 50; queueModal(()=>showLevelUp(after)); }
  if(prevDay < DAILY_GOAL && S.days[t] >= DAILY_GOAL && S.chestDay!==t) queueModal(showChest);
  checkBadges(); checkParentGoals();
  save(); renderHeader();
  toast(`+${n} XP · ${why}`);
}
function award(id){
  if(S.badges[id] || COACH_MODE) return;
  S.badges[id] = today(); S.coins += 25;
  const b = BADGES.find(x=>x.id===id);
  queueModal(()=>showBadge(b));
}
function masteredCount(){ return TOPICS.filter(t=>masteryState(t.id)==="m").length; }
function checkBadges(){
  if(COACH_MODE) return;
  const st = liveStreak();
  if(S.n.quiz>=1) award("first");
  if(S.n.perfect>=1) award("perfect");
  if(st>=3) award("streak3"); if(st>=7) award("streak7"); if(st>=30) award("streak30");
  if(S.n.daily>=5) award("daily5");
  if(S.n.tutor>=20) award("curious");
  if(S.n.subnet>=10) award("subnet");
  if(S.n.trace>=10) award("trace");
  const beeps = BANK.filter(q=>q.tags.includes("beep")); if(beeps.length && beeps.every(q=>S.beepOK[q.id])) award("beep");
  if(Object.values(S.games).some(b=>b>=15)) award("game");
  if(masteredCount()>=5) award("master5");
  if(TOPICS.every(t=>S.topics[t.id]?.quiz)) award("allround");
  if(S.xp>=1000) award("xp1000");
  if(S.n.photo>=1) award("photo");
  if(S.n.review>=1) award("fixer");
}

/* =================== PROGRESS PER TOPIC =================== */
function topicStat(id){ return S.topics[id] || (S.topics[id] = {att:0,ok:0,best:0,quiz:0,last:null,time:0,recent:[],lessons:0,wrong:0}); }
/* Mastery % = accuracy over the last 10 answers in the topic. Labels: Not started · Learning (<50) · Getting there (50-79, or fewer than 5 answers) · Mastered (80%+ with 5+ answers) */
function masteryPct(id){ const t=S.topics[id]; if(!t || !t.recent?.length) return null; return Math.round(t.recent.reduce((a,b)=>a+b,0)/t.recent.length*100); }
function masteryState(id){ const t=S.topics[id]; const p=masteryPct(id);
  if(p===null) return t && (t.lessons) ? "l" : "n";
  if(p>=80 && t.att>=5) return "m"; if(p>=50 || (p>=80)) return "g"; return "l"; }
const MLABEL = {n:"Not started", l:"Learning", g:"Getting there", m:"Mastered"};
const MCLS = {n:"", l:"low", g:"mid", m:"good"};
function subjPct(s){ const ts=topicsOf(s); return Math.round(ts.reduce((a,t)=>a+(masteryPct(t.id)||0),0)/ts.length); }
function weakTopics(n=3, s=null){
  return TOPICS.filter(t=>(!s||t.s===s)).map(t=>({t, p:masteryPct(t.id), st:S.topics[t.id]})).filter(x=>x.p!==null && masteryState(x.t.id)!=="m")
    .sort((a,b)=>(a.p-b.p) || ((b.st.wrong||0)-(a.st.wrong||0))).slice(0,n).map(x=>x.t);
}
function dueReviews(s=null){ const t=today(); return Object.entries(S.srs).filter(([id,r])=>QB[id] && r.due<=t && (!s||QB[id].s===s)).map(([id])=>id); }

/* Record one answered question everywhere it needs to go */
function recordAnswer(q, ok, ms, mode, chosenText){
  const st = topicStat(q.t);
  st.att++; if(ok) st.ok++; else st.wrong++;
  st.recent.push(ok?1:0); if(st.recent.length>10) st.recent.shift();
  st.last = today(); st.time += Math.min(Math.max(0,ms||0), 300000);
  S.log.push({at:new Date().toISOString(), q:q.id, t:q.t, ok:ok?1:0, m:mode, ms:Math.round(ms||0), c:String(chosenText??"").slice(0,80)});
  if(S.log.length>4000) S.log.splice(0, S.log.length-4000);
  /* spaced repetition: a missed question comes back tomorrow, then in 3 days, until it's right twice */
  if(!ok) S.srs[q.id] = {due:addDays(1), ok:0};
  else if(S.srs[q.id]){ const r=S.srs[q.id]; r.ok++; if(r.ok>=2) delete S.srs[q.id]; else r.due = addDays(3); }
  if(ok){ if(q.tags.includes("subnet")) S.n.subnet++; if(q.tags.includes("trace")) S.n.trace++; if(q.tags.includes("beep")) S.beepOK[q.id]=1; }
  if(!ok){ S.mistakes = S.mistakes.filter(m=>m.id!==q.id); S.mistakes.unshift({id:q.id, t:q.t, q:q.q, chosen:String(chosenText??""), correct:answerText(q), fix:q.trap||"", d:today()}); S.mistakes = S.mistakes.slice(0,60); }
}
function answerText(q){
  if(q.ty==="mc") return q.o[q.a];
  if(q.ty==="tf") return q.a?"True":"False";
  if(q.ty==="fill") return q.a[0];
  if(q.ty==="order") return q.o.join(" → ");
  if(q.ty==="match") return q.o.map(p=>p[0]+" = "+p[1]).join("; ");
  if(q.ty==="trace") return traceAnswerText(q);
  return "";
}

/* =================== SIGNING (Coach claim links, parent links) =================== */
const enc = new TextEncoder();
async function hmac(key, msg){
  const k = await crypto.subtle.importKey("raw", enc.encode(key), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const sig = new Uint8Array(await crypto.subtle.sign("HMAC", k, enc.encode(msg)));
  return [...sig.slice(0,8)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function sha(msg){ const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(msg))); return [...h].map(b=>b.toString(16).padStart(2,"0")).join(""); }
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));

/* Coach → app: "Add X XP to app". Max 1,000 XP per link; each link id can be used once. */
function pendingCounts(){ const b=S.pendBase||{}; const f=k=>Math.max(0,(S.n[k]||0)-(b[k]||0)); return {t:f("tutor"), s:f("structured"), p:f("photo"), r:f("review")}; }
let claimCache = {key:"", url:""};
async function claimURL(){
  const x = Math.min(S.pendXP||0, MAX_CLAIM), c = pendingCounts(); S.claimId ||= newCode().slice(0,8);
  const body = `x${x}t${c.t}s${c.s}p${c.p}r${c.r}-${S.claimId}`;
  if(claimCache.key===body) return claimCache.url;
  const url = `${APP_URL}/#claim-${body}-${await hmac(CLAIM_KEY, body)}`;
  claimCache = {key:body, url}; return url;
}
function markClaimSent(){
  const x = Math.min(S.pendXP||0, MAX_CLAIM);
  S.pendXP = Math.max(0,(S.pendXP||0)-x);
  S.pendBase = {tutor:S.n.tutor, structured:S.n.structured, photo:S.n.photo, review:S.n.review};
  S.claimId = null; save(); renderHeader();
}
async function handleClaim(){
  const m = location.hash.match(/^#claim-(x(\d+)t(\d+)s(\d+)p(\d+)r(\d+)-([a-z0-9]+))-([0-9a-f]{16})$/);
  if(!m || COACH_MODE) return;
  try{ history.replaceState(null,"",location.pathname); }catch(e){ location.hash=""; }
  if(S.role==="parent"){ toast("That's a Coach points link for Suri's phone."); return; }
  const [_,body,x,t,s2,p,r,id,sig] = m;
  if(await hmac(CLAIM_KEY, body)!==sig){ toast("That points link didn't work."); return; }
  if(S.claimed[id]){ toast("Those Coach points were already added."); return; }
  S.claimed[id]=today(); const keys=Object.keys(S.claimed); if(keys.length>300) delete S.claimed[keys[0]];
  S.n.tutor+=+t; S.n.structured+=+s2; S.n.photo+=+p; S.n.review+=+r;
  if(+x>0) addXP(Math.min(+x,MAX_CLAIM), "from Coach"); else { checkBadges(); save(); toast("Coach activity added"); }
  if(+s2>0) checkParentGoals();
}
async function signed(kind, o){ const d=b64e(o); return `${APP_URL}/#${kind}-${d}-${await hmac(LINK_KEY, kind+"|"+d)}`; }
async function readSigned(kind){
  const m = location.hash.match(new RegExp("^#"+kind+"-([A-Za-z0-9_-]+)-([0-9a-f]{16})$")); if(!m) return null;
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  if(await hmac(LINK_KEY, kind+"|"+m[1])!==m[2]) { toast("That link looks damaged. Ask for it to be sent again."); return null; }
  try{ return b64d(m[1]); }catch(e){ toast("That link looks damaged. Ask for it to be sent again."); return null; }
}

/* =================== MARKDOWN =================== */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inl(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g,"$1<em>$2</em>");
  return s;
}
function mdTable(rows){
  const cells = r => r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const isSep = r => /^\s*\|?\s*:?-{2,}/.test(r) && /^[\s|:\-]+$/.test(r);
  let head = null, body = rows;
  if(rows.length>1 && isSep(rows[1])){ head = cells(rows[0]); body = rows.slice(2); }
  body = body.filter(r=>!isSep(r));
  let h = '<div class="tbl"><table>';
  if(head) h += "<thead><tr>"+head.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead>";
  h += "<tbody>"+body.map(r=>"<tr>"+cells(r).map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
  return h;
}
function md(src){
  const L = String(src||"").replace(/\r/g,"").split("\n"); const out=[]; let i=0;
  const startRe = /^(```|#{1,6}\s|\s*[-*•]\s+|\s*\d+[.)]\s+|\s*\|.*\|\s*$|\s*(---|\*\*\*)\s*$)/;
  while(i<L.length){
    const l = L[i];
    if(/^```/.test(l)){ const lang=(l.match(/^```\s*([\w-]+)/)||[])[1]; const b=[]; i++; let closed=false; while(i<L.length){ if(/^```/.test(L[i])){ closed=true; break; } b.push(L[i++]); } i++;
      const vis = lang && VIS_FENCE[lang.toLowerCase()] ? (closed ? fenceVisual(lang, b.join("\n")) : `<p class="muted"><i>Drawing a diagram…</i></p>`) : null;
      out.push(vis || "<pre>"+esc(b.join("\n"))+"</pre>"); continue; }
    if(/^\s*\|.*\|\s*$/.test(l)){ const r=[]; while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])) r.push(L[i++]); out.push(mdTable(r)); continue; }
    const h = l.match(/^(#{1,6})\s+(.*)/); if(h){ const lv=Math.min(6,h[1].length+2); out.push(`<h${lv}>${inl(h[2])}</h${lv}>`); i++; continue; }
    if(/^\s*[-*•]\s+/.test(l)){ const it=[]; while(i<L.length && /^\s*[-*•]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*[-*•]\s+/,"")); out.push("<ul>"+it.map(x=>"<li>"+inl(x)+"</li>").join("")+"</ul>"); continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ const it=[]; const st=parseInt(l,10)||1; while(i<L.length && /^\s*\d+[.)]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*\d+[.)]\s+/,"")); out.push(`<ol start="${st}">`+it.map(x=>"<li>"+inl(x)+"</li>").join("")+"</ol>"); continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(!l.trim()){ i++; continue; }
    const p=[L[i++]]; while(i<L.length && L[i].trim() && !startRe.test(L[i])) p.push(L[i++]);
    out.push("<p>"+inl(p.join(" "))+"</p>");
  }
  return out.join("");
}
/* Diagrams the Coach can draw from small JSON blocks */
function flowHTML(d){ const st=(d.steps||[]).map(x=>typeof x==="string"?{t:x}:x);
  return `<div class="vis">${d.title?`<div class="vis-title">${esc(d.title)}</div>`:""}<div class="flow">${st.map((s,k)=>`${k?'<div class="ar">▼</div>':""}<div class="fs ${s.shape||""}"><span class="n">${k+1}</span><div><b>${esc(s.t)}</b>${s.s?`<small>${esc(s.s)}</small>`:""}</div></div>`).join("")}</div></div>`; }
function layersHTML(d){ const cols=["#E0533D","#E98A2E","#D9B21C","#47A34B","#2F8FB5","#3C63C9","#7A4CC8"];
  return `<div class="vis">${d.title?`<div class="vis-title">${esc(d.title)}</div>`:""}<div class="layers">${(d.rows||[]).map((r,k,a)=>{ const [n,lab,sub]=Array.isArray(r)?r:[r.n,r.t,r.s]; const c=cols[(+n||a.length-k)-1]||cols[k%7]; return `<div class="lay" style="--c:${c}"><span class="ln">${esc(n??"")}</span><b>${esc(lab)}</b>${sub?`<small>${esc(sub)}</small>`:""}</div>`; }).join("")}</div></div>`; }
function compareHTML(d){ return `<div class="vis">${d.title?`<div class="vis-title">${esc(d.title)}</div>`:""}<div class="cmp">${(d.cols||[]).map(c=>`<div><h4>${esc(c.h)}</h4><ul>${(c.items||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div></div>`; }
const VIS_FENCE = {flow:flowHTML, flowchart:flowHTML, layers:layersHTML, compare:compareHTML};
function fenceVisual(lang, body){ try{ return VIS_FENCE[lang.toLowerCase()](JSON.parse(body)); }catch(e){ return "<pre>"+esc(body)+"</pre>"; } }

/* =================== QUIZ ENGINE =================== */
let Q = null, qTimer = null;
function stopQuizTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function pickQuestions({mode, topics, ids, n=5, s}){
  if(ids) return ids.filter(id=>QB[id]);
  const due = new Set(dueReviews());
  const wrongEver = new Set(S.mistakes.map(m=>m.id));
  let pool = BANK;
  if(topics) pool = BANK.filter(q=>topics.includes(q.t));
  else if(s) pool = BANK.filter(q=>q.s===s);
  if(mode==="fix"){
    const weak = new Set(weakTopics(3, s).map(t=>t.id));
    const score = q => (due.has(q.id)?100:0) + (wrongEver.has(q.id)?50:0) + (weak.has(q.t)?20:0) + Math.random()*10;
    return pool.map(q=>[q,score(q)]).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0].id);
  }
  if(mode==="exam") return shuffle(pool).slice(0,n).map(q=>q.id);
  const first = shuffle(pool.filter(q=>due.has(q.id))).slice(0, Math.ceil(n/3));
  const rest = shuffle(pool.filter(q=>!first.includes(q)));
  return shuffle(first.concat(rest).slice(0,n)).map(q=>q.id);
}
function prepItem(id){
  const q = QB[id], it = {id};
  if(q.ty==="mc") it.ord = shuffle(q.o.map((_,k)=>k));
  if(q.ty==="order"){ let o; do{ o = shuffle(q.o.map((_,k)=>k)); }while(q.o.length>1 && o.every((x,k)=>x===k)); it.cur = o; }
  if(q.ty==="match") it.rights = shuffle(q.o.map(p=>p[1])), it.pick = q.o.map(()=> "");
  return it;
}
function startQuiz(opts){
  const ids = pickQuestions(opts);
  if(!ids.length){ toast("Questions for this one are coming in the next update."); return; }
  const exam = opts.mode==="exam";
  Q = {mode:opts.mode, title:opts.title||"Quiz", s:opts.s||null, topics:opts.topics||null, items:ids.map(prepItem), i:0, results:[], chosen:[], answered:false, t0:Date.now(), qStart:Date.now(), exam, xp:0};
  if(exam){ Q.deadline = Date.now() + opts.min*60000; Q.min = opts.min; }
  go("quiz");
  if(exam){ qTimer = setInterval(()=>{ const left=Math.max(0,Q.deadline-Date.now()); const el=$("#qTimer"); if(el) el.textContent = fmtClock(left); if(left<=0){ stopQuizTimer(); Q.i = Q.items.length; toast("Time's up! Let's see how you did."); render(); } }, 500); }
}
const fmtClock = ms => { const s=Math.ceil(ms/1000); return Math.floor(s/60)+":"+pad(s%60); };
function norm(x){ return String(x).toLowerCase().replace(/\s+/g,"").replace(/[“”"']/g,""); }
/* returns [ok, chosenText] */
function checkItem(q, it, val){
  if(q.ty==="mc"){ const k = it.ord[val]; return [k===q.a, q.o[k]]; }
  if(q.ty==="tf") return [val===q.a, val?"True":"False"];
  if(q.ty==="fill") return [q.a.some(a=>norm(a)===norm(val)), val];
  if(q.ty==="order") return [it.cur.every((x,k)=>x===k), it.cur.map(k=>q.o[k]).join(" → ")];
  if(q.ty==="match"){ const ok = q.o.every((p,k)=>it.pick[k]===p[1]); return [ok, q.o.map((p,k)=>p[0]+" = "+(it.pick[k]||"?")).join("; ")]; }
  if(q.ty==="trace"){ const r = traceCheck(q, val); return [r.every(Boolean), `${r.filter(Boolean).length}/${r.length} boxes right`]; }
  return [false,""];
}
function submitAnswer(val){
  const it = Q.items[Q.i], q = QB[it.id];
  if(Q.answered) return;
  const [ok, chosen] = checkItem(q, it, val);
  const ms = Date.now()-Q.qStart;
  Q.results[Q.i] = ok; Q.chosen[Q.i] = chosen; it.val = val;
  recordAnswer(q, ok, ms, Q.mode, chosen);
  if(Q.exam){ save(); Q.i++; Q.qStart = Date.now(); render(); window.scrollTo({top:0}); return; }
  Q.answered = true;
  if(ok){ Q.xp += XP.correct; addXP(XP.correct, "correct answer"); } else save();
  render();
  setTimeout(()=>$(".fb")?.scrollIntoView({behavior:"smooth",block:"nearest"}),50);
}
function qBody(q, it, showFb){
  const sub = `s-${q.s}`;
  let h = `<div class="qtext">${esc(q.q)}</div>${q.code?`<pre class="qcode">${esc(q.code)}</pre>`:""}${q.fc?flowSVG(q.fc):""}`;
  if(q.ty==="mc"){
    h += `<div class="opts">${it.ord.map((k,j)=>{ const cls = !showFb ? "" : k===q.a ? "ok" : (it.val===j ? "bad" : ""); return `<button class="opt ${cls}" data-v="${j}" ${showFb?"disabled":""}><span class="L">${"ABCD"[j]}</span><span>${esc(q.o[k])}</span></button>`; }).join("")}</div>`;
  } else if(q.ty==="tf"){
    h += `<div class="grid2">${[true,false].map(b=>{ const cls = !showFb ? "" : b===q.a ? "ok" : (it.val===b ? "bad" : ""); return `<button class="opt ${cls}" data-tf="${b}" ${showFb?"disabled":""} style="grid-template-columns:1fr;text-align:center;font-weight:700">${b?"True":"False"}</button>`; }).join("")}</div>`;
  } else if(q.ty==="fill"){
    h += `<div class="row" style="flex-wrap:nowrap"><input class="field mono" id="fillIn" autocomplete="off" autocapitalize="off" placeholder="Type your answer" value="${esc(it.val||"")}" ${showFb?"disabled":""}>${showFb?"":`<button class="btn sub" id="fillGo">${Q.exam?"Next":"Check"}</button>`}</div>`;
  } else if(q.ty==="order"){
    h += `<p class="muted" style="margin:0;font-size:14px">Use the arrows to put them in order (top = first).</p><div class="ordlist">${it.cur.map((k,j)=>`<div class="orditem ${showFb?(k===j?"ok":"bad"):""}"><span class="n">${j+1}</span><span>${esc(q.o[k])}</span>${showFb?"":`<span class="mv"><button data-up="${j}" aria-label="Move up" ${j===0?"disabled":""}>↑</button><button data-dn="${j}" aria-label="Move down" ${j===it.cur.length-1?"disabled":""}>↓</button></span>`}</div>`).join("")}</div>
    ${showFb?"":`<button class="btn sub block" id="ordGo">${Q.exam?"Save and next":"Check my order"}</button>`}`;
  } else if(q.ty==="match"){
    h += `<div class="matchgrid">${q.o.map((p,k)=>`<div class="matchrow ${showFb?(it.pick[k]===p[1]?"ok":"bad"):""}"><span class="l">${esc(p[0])}</span><select class="field" data-m="${k}" ${showFb?"disabled":""} aria-label="Match for ${esc(p[0])}"><option value="">Choose…</option>${it.rights.map(r=>`<option ${it.pick[k]===r?"selected":""}>${esc(r)}</option>`).join("")}</select></div>`).join("")}</div>
    ${showFb?"":`<button class="btn sub block" id="matchGo">${Q.exam?"Save and next":"Check my matches"}</button>`}`;
  } else if(q.ty==="trace"){
    h += traceQHTML(q, it, showFb);
  }
  return `<div class="${sub}" style="display:flex;flex-direction:column;gap:12px">${h}</div>`;
}
function bindQ(v, q, it){
  v.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>submitAnswer(+b.dataset.v));

  v.querySelectorAll("[data-b]").forEach(x=>x.oninput=x.onchange=()=>{ (it.val ||= [])[+x.dataset.b]=x.value.trim(); });
  if($("#matchGo")) $("#matchGo").onclick=()=>{ if(it.pick.some(x=>!x)){ toast("Match every item first."); return; } submitAnswer(it.pick.slice()); };

let quitArmed = 0;
function confirmQuit(){ if(Date.now()-quitArmed < 4000) return true; quitArmed = Date.now(); toast("Tap Quit again to end the exam."); return false; }
function quizDone(v){
  stopQuizTimer();
  const total = Q.items.length, right = Q.results.filter(Boolean).length, pct = Math.round(right/total*100);
  if(!Q.finished){
    Q.finished = true;
    const ms = Date.now()-Q.t0;
    S.quizLog.push({at:new Date().toISOString(), mode:Q.mode, title:Q.title, s:Q.s, score:right, total, ms, ids:Q.items.map(x=>x.id), res:Q.results.map(x=>x?1:0)});
    if(S.quizLog.length>500) S.quizLog.splice(0, S.quizLog.length-500);
    if(Q.exam){ Q.items.forEach((it,k)=>{ if(Q.results[k]===undefined){ const q=QB[it.id]; Q.results[k]=false; Q.chosen[k]="(no answer)"; recordAnswer(q,false,0,"exam","(no answer)"); } }); }
    if(Q.mode==="daily"){ S.daily = today(); S.n.daily++; addXP(XP.daily, "daily challenge"); }
    else {
      S.n.quiz++; if(pct===100) S.n.perfect++;
      const per = {};
      Q.items.forEach((it,k)=>{ const t=QB[it.id].t; (per[t] ||= [0,0]); per[t][1]++; if(Q.results[k]) per[t][0]++; });
      for(const [tid,[r,n]] of Object.entries(per)){ const st=topicStat(tid); if(Q.mode==="topic"||Q.mode==="weak"||n>=3){ st.quiz++; st.best=Math.max(st.best, Math.round(r/n*100)); } }
      const bonus = (Q.exam ? right*XP.correct : 0) + XP.quiz + (pct===100?XP.perfect:0);
      addXP(bonus, pct===100?"perfect quiz bonus!":Q.exam?"exam simulation marked":"quiz complete");
    }
  }
  const wrong = Q.items.map((it,k)=>({q:QB[it.id],k})).filter(x=>!Q.results[x.k]);
  const msg = pct===100?"Bug-free! Every answer right.":pct>=80?"Strong work. You're close to mastering this.":pct>=50?"Good effort. Let's fix the ones you missed.":"This needs more practice, and that's fine. Every mistake here is one you won't make in the exam.";
  const missed = wrong.map(({q,k})=>({t:q.t, q:q.q, chosen:Q.chosen[k], correct:answerText(q)}));
  v.innerHTML = `

    <div class="big">${right}/${total}</div><h2 style="font-size:20px">${msg}</h2>${Q.exam?`<p style="margin:0">That's ${pct}%. The pass mark is 50%.</p>`:""}</div>
  ${wrong.length?`<div class="card"><span class="eyebrow">What you missed</span><div class="view" style="gap:12px;margin-top:8px">${wrong.map(({q,k})=>`<div class="mistake"><b>${esc(q.q)}</b>${q.code?`<pre class="qcode">${esc(q.code)}</pre>`:""}<span>You said: ${esc(Q.chosen[k])}</span><span>Answer: <b>${esc(answerText(q))}</b></span>${q.trap?`<span class="muted">${esc(q.trap)}</span>`:""}</div>`).join("")}</div>
   <a class="btn gold block" style="margin-top:12px" href="${esc(coachLink({mistakes:missed, m:"review", s:Q.s||wrong[0].q.s}))}" target="_blank" rel="noopener">Review my mistakes with Coach ↗</a>
   <p class="muted" style="margin:8px 0 0;font-size:13px">Missed questions come back in <b>Fix My Weak Spots</b> until you get them right twice.</p></div>`:""}
  <div class="grid2">
    ${Q.mode==="daily"?"":`<button class="btn" id="qAgain">Another round</button>`}
    <button class="btn ghost" id="qHome">Back to home</button>
  </div>`;
  const last = Q;
  if($("#qAgain")) $("#qAgain").onclick = ()=>startQuiz({mode:last.mode, topics:last.topics, s:last.s, n:last.items.length, title:last.title, min:last.min});
  $("#qHome").onclick = ()=>{ Q=null; go("home"); };
}

function nextCard(){ G.cur = G.deck[G.i % G.deck.length]; G.opts = gameOptions(G.cur); }
function startGame(){
  stopGame();
