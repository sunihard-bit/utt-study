<title>UTT Study Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Phone-first app shell: sticky score bar, one view at a time, tab bar fixed at the bottom.
   Circuit teal brand, one accent per subject (blue = Networks, violet = Logic & Python, orange = Hardware), gold for rewards, red for mistakes. */
:root{
  --bg:#EEF4F4; --paper:#FFFFFF; --ink:#11252A; --muted:#566C72; --line:#D2E0E1;
  --brand:#0E7C7B; --brand-2:#0A5A5A; --brand-soft:#D8EEED; --on-brand:#FFFFFF;
  --gold:#C98A0B; --gold-soft:#FBEFD2;
  --red:#C23B33; --red-soft:#F8E1DE;
  --ok:#1E8A4C; --ok-soft:#DDF1E4;
  --ntwk:#2F6FEB; --ntwk-soft:#E3ECFD; --logc:#7A3FD1; --logc-soft:#EEE6FA; --cohw:#D0581A; --cohw-soft:#FBE7DA;
  --sub:var(--brand); --sub-soft:var(--brand-soft);
  --f-display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:64px; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1517; --paper:#13211F; --ink:#E4F0EF; --muted:#90A8A6; --line:#24383A;
  --brand:#3CC2BC; --brand-2:#0D5452; --brand-soft:#143A39; --on-brand:#04201F;
  --gold:#F0B93A; --gold-soft:#3A2E12; --red:#F07A70; --red-soft:#3D1D1A; --ok:#5BD08A; --ok-soft:#143424;
  --ntwk:#82A9F7; --ntwk-soft:#1A2948; --logc:#B892F2; --logc-soft:#2B2143; --cohw:#F39A62; --cohw-soft:#3D2616; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1517; --paper:#13211F; --ink:#E4F0EF; --muted:#90A8A6; --line:#24383A;
  --brand:#3CC2BC; --brand-2:#0D5452; --brand-soft:#143A39; --on-brand:#04201F;
  --gold:#F0B93A; --gold-soft:#3A2E12; --red:#F07A70; --red-soft:#3D1D1A; --ok:#5BD08A; --ok-soft:#143424;
  --ntwk:#82A9F7; --ntwk-soft:#1A2948; --logc:#B892F2; --logc-soft:#2B2143; --cohw:#F39A62; --cohw-soft:#3D2616; color-scheme:dark}
.s-ntwk{--sub:var(--ntwk);--sub-soft:var(--ntwk-soft)} .s-logc{--sub:var(--logc);--sub-soft:var(--logc-soft)} .s-cohw{--sub:var(--cohw);--sub-soft:var(--cohw-soft)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-2)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code,.mono{font-family:var(--f-mono)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand-2);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;flex:1;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;opacity:.75;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.flame{color:#FFD27A}
.pill.coin{color:#FFE08A}
.pill a{color:inherit;text-decoration:none}
.xpbar{height:5px;background:rgba(255,255,255,.18)}
.xpbar i{display:block;height:100%;background:#FFC94A;transition:width .6s ease}
.avatarbtn{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;flex:none;padding:0}
.coinico{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#F4C84A;color:#5A3D00;font-size:10px;font-weight:800;font-family:var(--f-mono)}

/* views */
main{padding-block:16px 8px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:18px;margin-bottom:6px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.gold{background:var(--gold);color:#241800}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.sub{background:var(--sub);color:#fff}
.btn.subghost{background:var(--sub-soft);color:var(--sub)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.chip:hover{border-color:var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sub);border-radius:99px;transition:width .5s}
.back{border:0;background:none;color:var(--brand);font-weight:700;padding:6px 0;align-self:flex-start;min-height:36px}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:14px}
.note{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:14px}

/* hero with a faint circuit-board pattern */
.hero{background:var(--brand);color:var(--on-brand);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero.subj{background:var(--sub);color:#fff}
.hero h2{font-size:26px}
.hero .circuit{position:absolute;inset:0;pointer-events:none;opacity:.12;background:
  radial-gradient(circle at 20px 20px,currentColor 2.5px,transparent 3.5px) 0 0/80px 80px,
  linear-gradient(90deg,transparent 19px,currentColor 19px 21px,transparent 21px) 0 0/80px 40px,
  linear-gradient(0deg,transparent 59px,currentColor 59px 61px,transparent 61px) 20px 0/80px 80px;
  -webkit-mask-image:linear-gradient(110deg,transparent 35%,#000 85%);mask-image:linear-gradient(110deg,transparent 35%,#000 85%)}
.hero > *{position:relative}
.hero .eyebrow{color:inherit;opacity:.85}
.goal{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:66px;height:66px;border-radius:50%;background:conic-gradient(#FFC94A calc(var(--p)*1%),rgba(255,255,255,.22) 0);display:grid;place-items:center;flex:none}
.ring b{width:52px;height:52px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.13);border-radius:12px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.88}
.big{font-family:var(--f-display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

/* subject cards */
.subjects{display:flex;flex-direction:column;gap:10px}
.subjcard{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--sub);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.subjcard .ic{width:52px;height:52px;border-radius:14px;background:var(--sub-soft);color:var(--sub);display:grid;place-items:center}
.subjcard .ic svg{width:30px;height:30px}
.subjcard b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.2}
.subjcard .code{font-family:var(--f-mono);font-size:11px;color:var(--sub);letter-spacing:.06em}
.subjcard .pct{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--sub);font-variant-numeric:tabular-nums}
.segsub{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segsub button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 4px;font-weight:700;font-size:13px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2}
.segsub button small{font-family:var(--f-mono);font-size:10px;font-weight:400;color:var(--muted)}
.segsub button.on{border-color:var(--sub);background:var(--sub-soft);color:var(--sub)}

/* topics */
.sec-h{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.sec-h h3{font-size:16px}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%}
.titem .num{font-family:var(--f-mono);font-size:12px;color:var(--sub);font-weight:600;width:26px}
.titem b{display:block;font-weight:700;line-height:1.25}
.titem .sub{font-size:13px;color:var(--muted)}
.mastery{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.mastery.good{background:var(--ok-soft);color:var(--ok)}
.mastery.mid{background:var(--gold-soft);color:var(--gold)}
.mastery.low{background:var(--red-soft);color:var(--red)}
.notes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.learnlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.learnlist li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.learnlist li span{font-family:var(--f-mono);font-weight:700;color:var(--sub);background:var(--sub-soft);border-radius:7px;text-align:center;font-size:12px;padding:2px 0}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);background:var(--paper);text-align:left;min-width:0}
.tile b{font-size:13px;line-height:1.25}
.tile span{font-size:11px;color:var(--muted)}
.tile.g{border-color:var(--ok);background:var(--ok-soft)} .tile.a{border-color:var(--gold);background:var(--gold-soft)} .tile.r{border-color:var(--red);background:var(--red-soft)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table.stt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.stt th,table.stt td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.stt th:first-child,table.stt td:first-child{text-align:left;white-space:normal}
table.stt th{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto;margin:0 -4px}

/* markdown */
.md{min-width:0;overflow-wrap:anywhere}
.md p{margin:0 0 10px}
.md h3,.md h4,.md h5,.md h6{margin:14px 0 6px;font-size:17px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin-bottom:4px}
.md code{font-family:var(--f-mono);font-size:.9em;background:var(--brand-soft);padding:1px 5px;border-radius:5px}
.md pre{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;white-space:pre;margin:0 0 10px}
.md .tbl{overflow-x:auto;margin:0 0 10px;border:1px solid var(--line);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.md th,.md td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.md th{background:var(--brand-soft);font-weight:700}
.md tr:last-child td{border-bottom:0}
.md hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
.thinking{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-style:italic}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:3px;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* quiz */
.qcard{display:flex;flex-direction:column;gap:12px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qprog{display:flex;gap:4px;flex:1}
.qprog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.qprog i.ok{background:var(--ok)}.qprog i.bad{background:var(--red)}.qprog i.now{background:var(--gold)}
.qtext{font-size:18px;font-weight:600}
.qcode{font-family:var(--f-mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre;overflow-x:auto;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);width:100%;min-height:54px}
.opt .L{font-family:var(--f-mono);font-weight:700;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .L{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .L{background:var(--red);color:#fff}
.opt.sel{border-color:var(--sub);background:var(--sub-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--red-soft)}
.fb h4{font-size:17px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fixbox{border-left:3px solid var(--gold);padding-left:10px}
.ordlist{display:flex;flex-direction:column;gap:6px}
.orditem{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper)}
.orditem .n{font-family:var(--f-mono);font-weight:700;color:var(--sub)}
.orditem .mv{display:flex;gap:4px}
.orditem .mv button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;padding:0}
.orditem.ok{border-color:var(--ok);background:var(--ok-soft)} .orditem.bad{border-color:var(--red);background:var(--red-soft)}
.matchgrid{display:flex;flex-direction:column;gap:8px}
.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
.matchrow .l{font-weight:600;font-size:15px}
.matchrow.ok select{border-color:var(--ok)} .matchrow.bad select{border-color:var(--red)}
.timerpill{font-family:var(--f-mono);font-weight:700;padding:4px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.msg{max-width:92%;padding:10px 13px;border-radius:16px;min-width:0}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px;width:92%}
.msg.ai .md p:last-child{margin-bottom:0}
.msg .imgtag{display:block;font-size:12px;opacity:.85;margin-top:4px}
.composer{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 4px);background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;z-index:5}
.cbox{display:flex;gap:8px;align-items:flex-end;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:6px}
.cbox textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:8px;max-height:140px;outline:none}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.iconbtn.send{background:var(--brand);color:var(--on-brand)}
.iconbtn svg{width:20px;height:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips .chip{white-space:nowrap;flex:none}
.attach{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--gold-soft);border-radius:10px;padding:6px 10px}
.attach img{width:36px;height:36px;object-fit:cover;border-radius:6px}
.integrity{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px dashed var(--brand);border-radius:12px;padding:10px 12px;font-size:13px}
.integrity b{color:var(--brand)}

/* forms */
textarea.field,input.field,select.field{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;min-height:46px}
textarea.field{min-height:96px;resize:vertical;font-family:var(--f-body)}
textarea.mono,input.mono{font-family:var(--f-mono);font-size:15px}
label.lab{font-weight:600;font-size:14px;display:block;margin-bottom:4px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:4px}
.badge .medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--line);color:var(--muted);filter:grayscale(1)}
.badge.got .medal{background:var(--gold);color:#241800;box-shadow:0 0 0 3px var(--gold-soft);filter:none}
.badge:not(.got){opacity:.6}
.badge b{font-size:13px;line-height:1.2}
.badge span{font-size:11px;color:var(--muted);line-height:1.25}

/* speed games */
.gcard{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;transition:transform .15s}
.gcard.flashok{border-color:var(--ok);background:var(--ok-soft)}
.gcard.flashbad{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gcard .tx{font-size:20px;font-weight:700}
.gcard pre{font-family:var(--f-mono);font-size:14px;text-align:left;background:var(--bg);border-radius:10px;padding:10px;margin:0;white-space:pre;overflow-x:auto}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gopts .btn{min-height:62px;font-size:16px;background:var(--sub);color:#fff;white-space:pre-line}
.timer{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.mistake{border-left:3px solid var(--red);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:4px}

/* =================== QUESTION BANK ===================
   ty: mc (o = options, a = index) · tf (a = true/false) · fill (a = accepted answers) · order (o = items in the right order) · match (o = [left, right] pairs)

   why = why the answer is right · trap = the likely mistake and how to fix it */
const BANK = [
 /* ---------- NTWK ---------- */
 {id:"n1-01",t:"n1",d:"e",ty:"mc",q:"Every computer in the UTT lab plugs into one central switch. Which topology is this?",o:["Bus","Star","Ring","Mesh"],a:1,
  why:"In a star topology every device has its own cable to one central device, usually a switch.",trap:"Bus uses one shared backbone cable that every device taps into. If you see a central box, think star."},
 {id:"n1-02",t:"n1",d:"e",ty:"tf",q:"In a peer-to-peer network there is no dedicated server: each computer can both share and use resources.",a:true,
  why:"That's the definition of peer-to-peer. Each peer is equal, like friends lending each other notes.",trap:"Client/server is the one with a dedicated server that the other computers (clients) request things from."},
 {id:"n1-03",t:"n1",d:"m",ty:"mc",q:"A network links several office buildings across one city, such as Port of Spain. What type of network is it?",o:["PAN","LAN","MAN","WAN"],a:2,

 {id:"n1-04",t:"n1",d:"m",ty:"mc",q:"Which topology connects every device directly to every other device, giving the most redundant paths?",o:["Full mesh","Star","Bus","Ring"],a:0,
  why:"In a full mesh each device has a link to every other device, so if one link fails traffic can take another path.",trap:"A ring has only two neighbours per device. Mesh = many paths, like a spider's web."},

 {id:"n2-02",t:"n2",d:"e",ty:"mc",q:"At which OSI layer does a router make its decisions?",o:["Layer 1 – Physical","Layer 2 – Data Link","Layer 3 – Network","Layer 4 – Transport"],a:2,
  why:"Routers read IP addresses and choose the best path between networks. IP addressing lives at layer 3, the Network layer.",trap:"Switches are layer 2 (MAC addresses). Routers are layer 3 (IP addresses)."},
 {id:"n2-03",t:"n2",d:"m",ty:"match",q:"Match each OSI layer to its PDU.",o:[["Transport","Segment"],["Network","Packet"],["Data Link","Frame"],["Physical","Bits"]],

 {id:"n2-04",t:"n2",d:"m",ty:"mc",q:"The TCP/IP model's Application layer covers which OSI layers?",o:["Layer 7 only","Layers 5, 6 and 7","Layers 1 and 2","Layers 3 and 4"],a:1,

 {id:"n3-01",t:"n3",d:"m",ty:"mc",q:"In the T568B standard, what colour wire goes in pin 1?",o:["White/orange","White/green","Orange","Blue"],a:0,
  why:"T568B order: 1 white/orange, 2 orange, 3 white/green, 4 blue, 5 white/blue, 6 green, 7 white/brown, 8 brown.",trap:"White/green is pin 1 in T568A. The two standards swap the orange and green pairs."},
 {id:"n3-02",t:"n3",d:"e",ty:"mc",q:"What is the maximum length of a single UTP Ethernet cable run?",o:["10 m","100 m","500 m","2 km"],a:1,
  why:"Copper twisted-pair Ethernet (e.g. Cat5e, Cat6) is limited to 100 metres per run before the signal gets too weak.",trap:"Longer distances need fibre or a switch/repeater in between."},

 {id:"n4-01",t:"n4",d:"m",ty:"mc",q:"Which Wi-Fi standard works ONLY in the 5 GHz band?",o:["802.11a","802.11b","802.11g","802.11n"],a:0,
  why:"802.11a uses 5 GHz only. 802.11b and g use 2.4 GHz. 802.11n can use both.",trap:"Students think 'a' must be the oldest and slowest 2.4 GHz one. It's 5 GHz, up to 54 Mbps."},
 {id:"n4-02",t:"n4",d:"e",ty:"mc",q:"Which wireless security option is the newest and strongest?",o:["WEP","WPA","WPA2","WPA3"],a:3,
  why:"WPA3 is the newest standard with the strongest protection. WEP is old and easily cracked.",trap:"Never choose WEP on an exam as 'secure'. It's the weakest."},
 {id:"n5-01",t:"n5",d:"e",ty:"mc",q:"Which device learns MAC addresses and sends each frame only to the port where the destination is?",o:["Hub","Switch","Router","Repeater"],a:1,
  why:"A switch keeps a MAC address table, like an office receptionist who knows exactly which desk everyone sits at.",trap:"A hub repeats every signal out of every port, like shouting across the whole office."},
 {id:"n5-02",t:"n5",d:"e",ty:"mc",q:"You need to join a fibre-optic link to a copper Ethernet switch port. Which device do you use?",o:["Bridge","Access point","Media converter","Modem"],a:2,
  why:"A media converter changes the signal from one type of media (fibre/light) to another (copper/electricity).",trap:"A bridge joins two network segments; it doesn't change the type of cable."},
 {id:"n6-01",t:"n6",d:"e",ty:"fill",q:"Convert the binary octet 11000000 to decimal.",a:["192"],tags:["binary"],
  why:"Place values: 128 64 32 16 8 4 2 1. The two 1s are 128 + 64 = 192.",trap:"Start from the left with 128, not 1."},
 {id:"n6-02",t:"n6",d:"m",ty:"mc",q:"How many usable host addresses are in the network 192.168.10.0/26?",o:["64","62","30","254"],a:1,tags:["subnet"],
  why:"/26 leaves 32 − 26 = 6 host bits. 2⁶ = 64 addresses, minus 2 (network and broadcast) = 62 usable hosts.",trap:"64 forgets to subtract the network and broadcast addresses: usable hosts = 2ⁿ − 2."},
 {id:"n6-03",t:"n6",d:"h",ty:"mc",q:"What is the broadcast address of the subnet that contains 192.168.1.70/27?",o:["192.168.1.64","192.168.1.95","192.168.1.127","192.168.1.255"],a:1,tags:["subnet"],
  why:"/27 → block size 32. Subnets start at .0, .32, .64, .96. 70 is in the .64 subnet, which runs .64 to .95. The broadcast is the last address: .95.",trap:"192.168.1.64 is the network address (first). The broadcast is the LAST address before the next subnet starts (.96 − 1 = .95)."},
 {id:"n6-04",t:"n6",d:"m",ty:"mc",q:"A laptop shows the IP address 169.254.12.7. What does this usually mean?",o:["It's using the loopback address","It couldn't get an address from a DHCP server","It has a public IP address","It's connected to a WAN"],a:1,
  why:"169.254.x.x is APIPA. Windows gives itself one of these when it asks for a DHCP address and nobody answers.",trap:"Loopback is 127.0.0.1. APIPA is the 'I asked for an address and got no reply' sign."},
 {id:"n6-05",t:"n6",d:"m",ty:"tf",q:"172.20.5.1 is a private IP address.",a:true,
  why:"The private ranges are 10.0.0.0/8, 172.16.0.0 to 172.31.255.255 (172.16.0.0/12) and 192.168.0.0/16. 172.20 falls inside 172.16–172.31.",trap:"Not every 172.x address is private, only 172.16 to 172.31."},
 {id:"n6-06",t:"n6",d:"e",ty:"fill",q:"Write the subnet mask for /24 in dotted decimal.",a:["255.255.255.0"],tags:["subnet"],
  why:"/24 means 24 ones: 11111111.11111111.11111111.00000000 = 255.255.255.0.",trap:"Each group of 8 ones is 255."},
 {id:"n7-01",t:"n7",d:"e",ty:"mc",q:"Which of these is the largest WAN in the world?",o:["The UTT campus network","The internet","A home Wi-Fi network","A Bluetooth headset link"],a:1,
  why:"The internet is a huge WAN made of many connected networks spanning the whole planet.",trap:"A campus is a LAN (or MAN if spread across a city). Bluetooth is a PAN."},
 {id:"n8-01",t:"n8",d:"e",ty:"mc",q:"You install a new router. What's the FIRST hardening step?",o:["Enable every service","Change the default admin password","Leave remote management on","Turn off the firewall"],a:1,
  why:"Default passwords are published online, so anyone could log in. Changing them is step one of device hardening.",trap:"Hardening means turning things OFF and locking them down, not switching more on."},
 {id:"n9-01",t:"n9",d:"m",ty:"order",q:"Put the troubleshooting methodology steps in order.",o:["Identify the problem","Establish a theory of probable cause","Test the theory","Establish a plan of action","Implement the solution or escalate","Verify full functionality","Document findings"],
  why:"Identify → theory → test → plan → implement → verify → document. Documenting comes LAST so the next technician can learn from it.",trap:"Don't jump straight to fixing. You must identify the problem and test a theory first."},
 {id:"n9-02",t:"n9",d:"e",ty:"mc",q:"Which Windows command shows a PC's IP address, subnet mask and default gateway?",o:["ping","ipconfig","tracert","nslookup"],a:1,
  why:"ipconfig shows the IP settings. ipconfig /all shows even more, like the MAC address and DNS servers.",trap:"ping tests whether another device replies; it doesn't show your own settings."},
 {id:"n9-03",t:"n9",d:"m",ty:"mc",q:"Which tool helps you find which cable at the patch panel goes to a wall jack?",o:["Crimper","Toner probe","Punch-down tool","Loopback plug"],a:1,
  why:"A toner sends a tone down the cable and the probe beeps when you touch the right one at the other end.",trap:"A crimper attaches RJ45 plugs; a punch-down tool seats wires into a patch panel."},
 {id:"n9-04",t:"n9",d:"e",ty:"mc",q:"Which port does DNS use?",o:["25","53","80","443"],a:1,tags:["port"],
  why:"DNS uses port 53. Memory aid: DNS turns names into numbers, and 53 is the number.",trap:"25 is SMTP (email sending), 80 is HTTP, 443 is HTTPS."},

 /* ---------- LOGC ---------- */
 {id:"l1-01",t:"l1",d:"e",ty:"mc",q:"In which stage of the program development life cycle do you draw the flowchart?",o:["Analysis","Design","Coding","Testing"],a:1,
  why:"Design is where you plan the solution: the algorithm, flowchart or pseudocode, before writing any code.",trap:"Analysis is about understanding the problem (inputs, outputs, formulas), not drawing the solution yet."},
 {id:"l2-01",t:"l2",d:"e",ty:"mc",q:"Problem: 'Read the length and width of a room, then display its area.' What is the OUTPUT?",o:["Length","Width","Area","Length × width formula"],a:2,
  why:"The output is what the program displays: the area. Length and width are inputs; area = length × width is the process.",trap:"The formula belongs in the Process column of the IPO chart, not the Output."},
 {id:"l3-01",t:"l3",d:"e",ty:"match",q:"Match each flowchart symbol to its job.",o:[["Oval / rounded rectangle","Start or stop"],["Parallelogram","Input or output"],["Rectangle","Process (calculation)"],["Diamond","Decision (yes/no)"]],
  why:"Terminator = oval, input/output = parallelogram, process = rectangle, decision = diamond.",trap:"Input and output share the same parallelogram symbol."},
 {id:"l4-01",t:"l4",d:"e",ty:"mc",q:"What does this print?",code:"print(7 // 2)",o:["3.5","3","4","1"],a:1,tags:["predict"],
  why:"// is floor division: it divides and drops the decimal part. 7 // 2 = 3.",trap:"3.5 is what / gives. 1 is 7 % 2 (the remainder)."},
 {id:"l4-02",t:"l4",d:"m",ty:"mc",q:"What does this print?",code:"print('5' + '3')",o:["8","53","'5' + '3'","An error"],a:1,tags:["predict"],
  why:"'5' and '3' are strings (text). + joins strings together, so the result is 53.",trap:"Quotes make it text. To add numbers you'd need int('5') + int('3')."},
 {id:"l4-03",t:"l4",d:"m",ty:"mc",q:"age = input('Age: ') — what data type is age?",o:["int","float","str","bool"],a:2,
  why:"input() ALWAYS returns a string, even if the user types a number.",trap:"To do maths you must convert it: age = int(input('Age: '))."},
 {id:"l4-04",t:"l4",d:"m",ty:"fill",q:"What does print(2 + 3 * 4) display?",a:["14"],tags:["predict"],
  why:"Multiplication happens before addition: 3 * 4 = 12, then 2 + 12 = 14.",trap:"Working left to right gives 20. Use BODMAS: brackets, powers, × and ÷, then + and −."},
 {id:"l5-01",t:"l5",d:"h",ty:"mc",q:"What does this print?",code:"x = 10\nif x > 5:\n    print('A')\nelif x > 8:\n    print('B')\nelse:\n    print('C')",o:["A","B","A and B","C"],a:0,tags:["predict"],
  why:"Python checks from the top and stops at the first True condition. x > 5 is True, so it prints A and skips the rest.",trap:"x > 8 is also true, but it's never reached. Put the most specific (biggest) condition first."},
 {id:"l5-02",t:"l5",d:"e",ty:"tf",q:"In Python, = is used to compare two values.",a:false,
  why:"= assigns a value to a variable. == compares two values and gives True or False.",trap:"if x = 5: is a syntax error. Write if x == 5:"},
 {id:"l6-01",t:"l6",d:"m",ty:"mc",q:"What does this print?",code:"for i in range(1, 4):\n    print(i, end=' ')",o:["1 2 3 4","1 2 3","0 1 2 3","2 3 4"],a:1,tags:["predict"],
  why:"range(1, 4) starts at 1 and STOPS BEFORE 4, so you get 1 2 3.",trap:"The stop value is never included. That's the classic off-by-one mistake."},
 {id:"l6-02",t:"l6",d:"m",ty:"mc",q:"Why does this loop never end?",code:"n = 0\nwhile n < 3:\n    print(n)",o:["n starts at 0","The condition should use <=","n is never updated inside the loop","print() stops loops"],a:2,
  why:"n stays 0 forever, so n < 3 is always True. Add n = n + 1 inside the loop.",trap:"Every while loop needs a line inside that moves the variable towards making the condition False."},
 {id:"l6-03",t:"l6",d:"m",ty:"fill",q:"What does this print?",code:"total = 0\nfor i in range(1, 4):\n    total = total + i\nprint(total)",a:["6"],tags:["predict"],
  why:"i takes 1, 2, 3. total goes 0 → 1 → 3 → 6.",trap:"Remember range(1, 4) stops before 4, so 4 is not added."},
 {id:"l7-01",t:"l7",d:"m",ty:"mc",q:"In a sentinel-controlled loop, why do we read the first value BEFORE the loop?",o:["To make the loop faster","So the while condition has a value to test the first time","Because Python requires two input() calls","To skip the first value"],a:1,
  why:"This is the priming read. The while condition needs a real value to check before the loop starts.",trap:"Without the priming read, the variable doesn't exist yet when the condition is tested."},
 {id:"l7-02",t:"l7",d:"h",ty:"mc",q:"Marks are entered until -1. What's wrong with this?",code:"total = 0\nmark = int(input())\nwhile mark != -1:\n    mark = int(input())\n    total = total + mark",o:["Nothing","The first mark is skipped and the -1 is added to the total","It never stops","total should start at 1"],a:1,
  why:"The new value is read BEFORE adding, so the first mark is lost and the sentinel -1 gets added. Add first, then read the next value at the END of the loop.",trap:"Processing the sentinel by mistake is a top exam error. Order inside the loop: process, then read next."},

 /* ---------- COHW ---------- */
 {id:"c1-01",t:"c1",d:"e",ty:"mc",q:"Which component carries out program instructions and is often called the 'brain' of the computer?",o:["RAM","CPU","PSU","SSD"],a:1,
  why:"The CPU (central processing unit) fetches, decodes and executes instructions.",trap:"RAM holds what the CPU is working on (your desk); it doesn't do the thinking."},
 {id:"c1-02",t:"c1",d:"e",ty:"mc",q:"RAM is like your desk and storage is like your filing cabinet. What happens to what's in RAM when the PC is switched off?",o:["It's saved automatically","It's lost","It moves to the CPU","It's printed"],a:1,
  why:"RAM is volatile: it needs power to keep data. That's why you save work to storage.",trap:"Storage (SSD/HDD) keeps data with the power off. RAM does not."},
 {id:"c2-01",t:"c2",d:"m",ty:"mc",q:"Which motherboard form factor is the LARGEST?",o:["Mini-ITX","Micro-ATX","ATX","They're all the same"],a:2,
  why:"Standard ATX is 305 × 244 mm, micro-ATX is 244 × 244 mm and mini-ITX is just 170 × 170 mm.",trap:"Micro sounds small but mini-ITX is the smallest of the three."},
 {id:"c2-02",t:"c2",d:"e",ty:"mc",q:"Which slot is normally used for a graphics card?",o:["PCIe x1","PCIe x16","DIMM slot","M.2"],a:1,
  why:"Graphics cards need the most lanes, so they go in the long PCIe x16 slot.",trap:"DIMM slots are for RAM. M.2 is mostly for SSDs."},
 {id:"c2-03",t:"c2",d:"m",ty:"mc",q:"A PC beeps 3 times and won't boot. Beep codes differ between BIOS makers. What should you check FIRST to know what 3 beeps means?",o:["Reinstall Windows","The motherboard manual or maker's website","Replace the CPU","Change the monitor cable"],a:1,tags:["beep"],
  why:"The manual (or support site) lists that board's beep codes. Then you know which part to check, often RAM for memory codes.",trap:"Don't replace parts blindly. Look up the code first, then test the part it points to."},
 {id:"c3-01",t:"c3",d:"e",ty:"mc",q:"Why do you put thermal paste between the CPU and its cooler?",o:["To glue the cooler on","To fill tiny air gaps so heat moves to the cooler","To insulate the CPU from electricity","To make the fan spin"],a:1,
  why:"The metal surfaces have microscopic gaps. Paste fills them so heat transfers better than through air.",trap:"More is not better: a pea-sized amount is enough."},
 {id:"c3-02",t:"c3",d:"m",ty:"mc",q:"On an LGA socket, where are the pins?",o:["On the CPU","On the motherboard socket","On the cooler","There are no pins"],a:1,
  why:"LGA (land grid array): the pins are in the motherboard socket and the CPU has flat pads. PGA is the opposite: pins on the CPU.",trap:"Think 'L for Lands on the CPU': flat lands on the chip, pins in the socket."},
 {id:"c4-01",t:"c4",d:"e",ty:"tf",q:"A DDR4 memory stick will fit and work in a DDR5 slot.",a:false,
  why:"Each DDR generation has the notch in a different place and different voltages, so they are NOT interchangeable.",trap:"Always match the RAM generation to what the motherboard supports."},
 {id:"c4-02",t:"c4",d:"m",ty:"mc",q:"Roughly how much RAM can a 32-bit operating system use?",o:["2 GB","4 GB","16 GB","Unlimited"],a:1,
  why:"32 bits can address 2³² bytes = 4 GB. A 64-bit OS is needed to use more.",trap:"Adding 8 GB to a 32-bit OS won't help: it can only use about 4 GB (often a bit less)."},
 {id:"c5-01",t:"c5",d:"e",ty:"mc",q:"What does POST stand for?",o:["Power-On Self-Test","Primary Operating System Test","Power Output Supply Test","Processor On Startup Timer"],a:0,tags:["beep"],
  why:"POST is the Power-On Self-Test: the firmware checks the essential hardware before the OS loads.",trap:"If POST fails you'll often hear beep codes or see diagnostic lights."},
 {id:"c5-02",t:"c5",d:"m",ty:"mc",q:"A PC keeps losing its date and time every time it's unplugged. What's the most likely fix?",o:["Replace the CMOS battery","Add more RAM","Update the GPU driver","Replace the hard drive"],a:0,
  why:"The small coin battery on the motherboard keeps the real-time clock (and settings) running when the PC has no power.",trap:"Wrong time after unplugging is the classic sign of a dead CMOS battery."},
 {id:"c6-01",t:"c6",d:"m",ty:"mc",q:"Which PSU voltage rail powers the CPU and graphics card?",o:["3.3 V","5 V","12 V","240 V"],a:2,
  why:"The 12 V rail feeds the power-hungry parts: CPU (via the 8-pin connector) and GPU (via PCIe 6+2 connectors).",trap:"3.3 V and 5 V are for smaller loads. 240 V is wall power going INTO the PSU."},
 {id:"c7-01",t:"c7",d:"m",ty:"mc",q:"Which RAID level stripes data across disks with NO redundancy?",o:["RAID 0","RAID 1","RAID 5","RAID 10"],a:0,
  why:"RAID 0 splits data across disks for speed. If one disk dies, everything is lost.",trap:"The 0 is a reminder: zero protection."},
 {id:"c7-02",t:"c7",d:"m",ty:"tf",q:"Every M.2 SSD uses NVMe.",a:false,
  why:"M.2 is just the shape and slot. An M.2 drive can be SATA or NVMe, and the motherboard must support the type.",trap:"Don't confuse the form factor (M.2) with the interface (SATA or NVMe)."},
 {id:"c7-03",t:"c7",d:"m",ty:"tf",q:"RAID 1 (mirroring) means you don't need a backup.",a:false,
  why:"RAID protects against a drive failing, but if you delete a file or get ransomware, the mirror copies the damage too.",trap:"RAID is NOT a backup. Keep a separate copy."},
 {id:"c8-01",t:"c8",d:"m",ty:"mc",q:"What is the maximum speed of USB 2.0?",o:["12 Mbps","480 Mbps","5 Gbps","40 Gbps"],a:1,
  why:"USB 2.0 (Hi-Speed) runs at up to 480 Mbps. USB 3.x starts at 5 Gbps.",trap:"40 Gbps is Thunderbolt 3/4 or USB4."},
 {id:"c9-01",t:"c9",d:"e",ty:"mc",q:"Which video port carries digital video AND audio and is found on almost every TV?",o:["VGA","DVI","HDMI","PS/2"],a:2,
  why:"HDMI carries digital video and audio in one cable.",trap:"VGA is analogue and video-only. DVI is mostly video-only."},
 {id:"c10-01",t:"c10",d:"m",ty:"mc",q:"Which describes a Type 2 hypervisor?",o:["Runs directly on the hardware","Runs as an app on top of a host OS, like VirtualBox","Is the same as a BIOS","Can only run Linux"],a:1,
  why:"Type 2 (hosted) hypervisors such as VirtualBox run on top of Windows/macOS/Linux. Type 1 (bare-metal) runs straight on the hardware.",trap:"Type 1 = bare metal (closest to hardware). Type 2 = on top of an OS."},
 {id:"c12-01",t:"c12",d:"h",ty:"order",q:"Put the laser printing process in order.",o:["Processing","Charging","Exposing","Developing","Transferring","Fusing","Cleaning"],
  why:"Processing → Charging → Exposing → Developing → Transferring → Fusing → Cleaning.",trap:"Fusing (heat and pressure melting toner onto the paper) comes after transferring the toner."},
 {id:"c13-01",t:"c13",d:"e",ty:"mc",q:"T&TEC power goes out. Which device keeps the PC running for a few minutes so you can save and shut down?",o:["Surge suppressor","UPS","Line conditioner","Power strip"],a:1,
  why:"A UPS (uninterruptible power supply) has a battery that takes over instantly when mains power fails.",trap:"A surge suppressor only blocks spikes. It has no battery."},
];

function save(){

}
function canSync(){ return STANDALONE && /^https?:/.test(location.protocol) && S.role!=="parent" && !!S.name && !!S.cloud?.code; }
const CODE_ABC = "abcdefghjkmnpqrstuvwxyz23456789";
function newCode(){ const b = new Uint8Array(16); crypto.getRandomValues(b); return [...b].map(x=>CODE_ABC[x % CODE_ABC.length]).join(""); }
const fmtCode = c => (c||"").replace(/(.{4})(?=.)/g,"$1-");
async function syncNow(){
  if(!canSync() || !dirty) return;
  dirty = false; clearTimeout(syncT);
  try{
    const r = await fetch("/api/backup/"+S.cloud.code, {method:"PUT", keepalive:true, headers:{"content-type":"application/json"}, body:JSON.stringify({state:S, at:new Date().toISOString()})});
    if(!r.ok) throw 0; lastSync = new Date(); syncErr = false;
  }catch(e){ dirty = true; syncErr = true; }
}
async function pullCloud(code){
  const r = await fetch("/api/backup/"+code, {cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("net");
  const j = await r.json(); return j && j.state ? j.state : null;
}

/* =================== LEVELS, XP, STREAKS =================== */
function liveStreak(){ const g=gapDays(S.last); return g<=1 || (g-1)<=(S.freezes||0) ? S.streak : 0; }
function levelOf(xp){ let L=1; while(50*L*(L+1) <= xp) L++; return L; }
function levelFloor(L){ return 50*(L-1)*L; }
function levelName(L){ return LEVELS[Math.min(L-1, LEVELS.length-1)]; }

function addXP(n, why){
  n = Math.round(n); if(n<=0) return;
  if(COACH_MODE){ S.pendXP=(S.pendXP||0)+n; save(); renderHeader(); toast(`+${n} XP · tap "Add XP to app" when you're done`); return; }
  const before = levelOf(S.xp);
  S.xp += n; S.coins += n;
  const t = today(); const prevDay = S.days[t]||0; S.days[t] = prevDay + n;
  if(S.last !== t){ const g=gapDays(S.last);
    if(g===1) S.streak++;
    else if(g>1 && g<900 && (g-1)<=(S.freezes||0)){ S.freezes-=(g-1); S.streak++; setTimeout(()=>toast(`A streak freeze saved your ${S.streak-1}-day streak!`, true),1200); }
    else S.streak = 1;
    S.last = t; S.best = Math.max(S.best, S.streak); }
  const after = levelOf(S.xp);
  if(after>before){ S.coins += 50; queueModal(()=>showLevelUp(after)); }
  if(prevDay < DAILY_GOAL && S.days[t] >= DAILY_GOAL && S.chestDay!==t) queueModal(showChest);
  checkBadges(); checkParentGoals();
  save(); renderHeader();
  toast(`+${n} XP · ${why}`);
}
function award(id){
  if(S.badges[id] || COACH_MODE) return;
  S.badges[id] = today(); S.coins += 25;
  const b = BADGES.find(x=>x.id===id);
  queueModal(()=>showBadge(b));
}
function masteredCount(){ return TOPICS.filter(t=>masteryState(t.id)==="m").length; }
function checkBadges(){
  if(COACH_MODE) return;
  const st = liveStreak();
  if(S.n.quiz>=1) award("first");
  if(S.n.perfect>=1) award("perfect");
  if(st>=3) award("streak3"); if(st>=7) award("streak7"); if(st>=30) award("streak30");
  if(S.n.daily>=5) award("daily5");
  if(S.n.tutor>=20) award("curious");
  if(S.n.subnet>=10) award("subnet");
  if(S.n.trace>=10) award("trace");
  const beeps = BANK.filter(q=>q.tags.includes("beep")); if(beeps.length && beeps.every(q=>S.beepOK[q.id])) award("beep");
  if(Object.values(S.games).some(b=>b>=15)) award("game");
  if(masteredCount()>=5) award("master5");
  if(TOPICS.every(t=>S.topics[t.id]?.quiz)) award("allround");
  if(S.xp>=1000) award("xp1000");
  if(S.n.photo>=1) award("photo");
  if(S.n.review>=1) award("fixer");
}

function topicStat(id){ return S.topics[id] || (S.topics[id] = {att:0,ok:0,best:0,quiz:0,last:null,time:0,recent:[],lessons:0,wrong:0}); }
/* Mastery % = accuracy over the last 10 answers in the topic. Labels: Not started · Learning (<50) · Getting there (50-79, or fewer than 5 answers) · Mastered (80%+ with 5+ answers) */
function masteryPct(id){ const t=S.topics[id]; if(!t || !t.recent?.length) return null; return Math.round(t.recent.reduce((a,b)=>a+b,0)/t.recent.length*100); }
function masteryState(id){ const t=S.topics[id]; const p=masteryPct(id);
  if(p===null) return t && (t.lessons) ? "l" : "n";
  if(p>=80 && t.att>=5) return "m"; if(p>=50 || (p>=80)) return "g"; return "l"; }
const MLABEL = {n:"Not started", l:"Learning", g:"Getting there", m:"Mastered"};
const MCLS = {n:"", l:"low", g:"mid", m:"good"};
function subjPct(s){ const ts=topicsOf(s); return Math.round(ts.reduce((a,t)=>a+(masteryPct(t.id)||0),0)/ts.length); }
function weakTopics(n=3, s=null){
  return TOPICS.filter(t=>(!s||t.s===s)).map(t=>({t, p:masteryPct(t.id), st:S.topics[t.id]})).filter(x=>x.p!==null && masteryState(x.t.id)!=="m")
    .sort((a,b)=>(a.p-b.p) || ((b.st.wrong||0)-(a.st.wrong||0))).slice(0,n).map(x=>x.t);
}

/* Record one answered question everywhere it needs to go */
function recordAnswer(q, ok, ms, mode, chosenText){
  const st = topicStat(q.t);
  st.att++; if(ok) st.ok++; else st.wrong++;
  st.recent.push(ok?1:0); if(st.recent.length>10) st.recent.shift();
  st.last = today(); st.time += Math.min(Math.max(0,ms||0), 300000);
  S.log.push({at:new Date().toISOString(), q:q.id, t:q.t, ok:ok?1:0, m:mode, ms:Math.round(ms||0), c:String(chosenText??"").slice(0,80)});
  if(S.log.length>4000) S.log.splice(0, S.log.length-4000);
  /* spaced repetition: a missed question comes back tomorrow, then in 3 days, until it's right twice */
  if(!ok) S.srs[q.id] = {due:addDays(1), ok:0};
  else if(S.srs[q.id]){ const r=S.srs[q.id]; r.ok++; if(r.ok>=2) delete S.srs[q.id]; else r.due = addDays(3); }
  if(ok){ if(q.tags.includes("subnet")) S.n.subnet++; if(q.tags.includes("trace")) S.n.trace++; if(q.tags.includes("beep")) S.beepOK[q.id]=1; }
  if(!ok){ S.mistakes = S.mistakes.filter(m=>m.id!==q.id); S.mistakes.unshift({id:q.id, t:q.t, q:q.q, chosen:String(chosenText??""), correct:answerText(q), fix:q.trap||"", d:today()}); S.mistakes = S.mistakes.slice(0,60); }
}
function answerText(q){
  if(q.ty==="mc") return q.o[q.a];
  if(q.ty==="tf") return q.a?"True":"False";
  if(q.ty==="fill") return q.a[0];
  if(q.ty==="order") return q.o.join(" → ");
  if(q.ty==="match") return q.o.map(p=>p[0]+" = "+p[1]).join("; ");
  return "";
}

/* =================== SIGNING (Coach claim links, parent links) =================== */
const enc = new TextEncoder();
async function hmac(key, msg){
  const k = await crypto.subtle.importKey("raw", enc.encode(key), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const sig = new Uint8Array(await crypto.subtle.sign("HMAC", k, enc.encode(msg)));
  return [...sig.slice(0,8)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function sha(msg){ const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(msg))); return [...h].map(b=>b.toString(16).padStart(2,"0")).join(""); }
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));

/* Coach → app: "Add X XP to app". Max 1,000 XP per link; each link id can be used once. */
function pendingCounts(){ const b=S.pendBase||{}; const f=k=>Math.max(0,(S.n[k]||0)-(b[k]||0)); return {t:f("tutor"), s:f("structured"), p:f("photo"), r:f("review")}; }
let claimCache = {key:"", url:""};
async function claimURL(){
  const x = Math.min(S.pendXP||0, MAX_CLAIM), c = pendingCounts(); S.claimId ||= newCode().slice(0,8);
  const body = `x${x}t${c.t}s${c.s}p${c.p}r${c.r}-${S.claimId}`;
  if(claimCache.key===body) return claimCache.url;
  const url = `${APP_URL}/#claim-${body}-${await hmac(CLAIM_KEY, body)}`;
  claimCache = {key:body, url}; return url;
}
function markClaimSent(){
  const x = Math.min(S.pendXP||0, MAX_CLAIM);
  S.pendXP = Math.max(0,(S.pendXP||0)-x);
  S.pendBase = {tutor:S.n.tutor, structured:S.n.structured, photo:S.n.photo, review:S.n.review};

async function handleClaim(){
  const m = location.hash.match(/^#claim-(x(\d+)t(\d+)s(\d+)p(\d+)r(\d+)-([a-z0-9]+))-([0-9a-f]{16})$/);
  if(!m || COACH_MODE) return;
  try{ history.replaceState(null,"",location.pathname); }catch(e){ location.hash=""; }
  if(S.role==="parent"){ toast("That's a Coach points link for Suri's phone."); return; }
  const [_,body,x,t,s2,p,r,id,sig] = m;
  if(await hmac(CLAIM_KEY, body)!==sig){ toast("That points link didn't work."); return; }
  if(S.claimed[id]){ toast("Those Coach points were already added."); return; }
  S.claimed[id]=today(); const keys=Object.keys(S.claimed); if(keys.length>300) delete S.claimed[keys[0]];
  S.n.tutor+=+t; S.n.structured+=+s2; S.n.photo+=+p; S.n.review+=+r;
  if(+x>0) addXP(Math.min(+x,MAX_CLAIM), "from Coach"); else { checkBadges(); save(); toast("Coach activity added"); }
  if(+s2>0) checkParentGoals();
}
async function signed(kind, o){ const d=b64e(o); return `${APP_URL}/#${kind}-${d}-${await hmac(LINK_KEY, kind+"|"+d)}`; }
async function readSigned(kind){
  const m = location.hash.match(new RegExp("^#"+kind+"-([A-Za-z0-9_-]+)-([0-9a-f]{16})$")); if(!m) return null;
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  if(await hmac(LINK_KEY, kind+"|"+m[1])!==m[2]) { toast("That link looks damaged. Ask for it to be sent again."); return null; }

}

/* =================== MARKDOWN =================== */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inl(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g,"$1<em>$2</em>");
  return s;
}
function mdTable(rows){
  const cells = r => r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const isSep = r => /^\s*\|?\s*:?-{2,}/.test(r) && /^[\s|:\-]+$/.test(r);
  let head = null, body = rows;
  if(rows.length>1 && isSep(rows[1])){ head = cells(rows[0]); body = rows.slice(2); }
  body = body.filter(r=>!isSep(r));
  let h = '<div class="tbl"><table>';
  if(head) h += "<thead><tr>"+head.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead>";
  h += "<tbody>"+body.map(r=>"<tr>"+cells(r).map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
  return h;
}
function md(src){
  const L = String(src||"").replace(/\r/g,"").split("\n"); const out=[]; let i=0;
  const startRe = /^(```|#{1,6}\s|\s*[-*•]\s+|\s*\d+[.)]\s+|\s*\|.*\|\s*$|\s*(---|\*\*\*)\s*$)/;
  while(i<L.length){
    const l = L[i];
    if(/^```/.test(l)){ const lang=(l.match(/^```\s*([\w-]+)/)||[])[1]; const b=[]; i++; let closed=false; while(i<L.length){ if(/^```/.test(L[i])){ closed=true; break; } b.push(L[i++]); } i++;
      const vis = lang && VIS_FENCE[lang.toLowerCase()] ? (closed ? fenceVisual(lang, b.join("\n")) : `<p class="muted"><i>Drawing a diagram…</i></p>`) : null;
      out.push(vis || "<pre>"+esc(b.join("\n"))+"</pre>"); continue; }
    if(/^\s*\|.*\|\s*$/.test(l)){ const r=[]; while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])) r.push(L[i++]); out.push(mdTable(r)); continue; }
    const h = l.match(/^(#{1,6})\s+(.*)/); if(h){ const lv=Math.min(6,h[1].length+2); out.push(`<h${lv}>${inl(h[2])}</h${lv}>`); i++; continue; }
    if(/^\s*[-*•]\s+/.test(l)){ const it=[]; while(i<L.length && /^\s*[-*•]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*[-*•]\s+/,"")); out.push("<ul>"+it.map(x=>"<li>"+inl(x)+"</li>").join("")+"</ul>"); continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ const it=[]; const st=parseInt(l,10)||1; while(i<L.length && /^\s*\d+[.)]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*\d+[.)]\s+/,"")); out.push(`<ol start="${st}">`+it.map(x=>"<li>"+inl(x)+"</li>").join("")+"</ol>"); continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(!l.trim()){ i++; continue; }
    const p=[L[i++]]; while(i<L.length && L[i].trim() && !startRe.test(L[i])) p.push(L[i++]);
    out.push("<p>"+inl(p.join(" "))+"</p>");
  }
  return out.join("");
}

async function restoreFrom(raw){
  const code = String(raw||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!/^[a-z2-9]{16}$/.test(code)){ toast("That code should be 16 letters and numbers."); return; }
  try{

    if(!remote){ toast("No backup found for that code."); return; }
    S = Object.assign(DEF(), remote); S.n = Object.assign(DEF().n, S.n||{}); S.cloud = {code, since:S.cloud?.since||today()}; S.role=null;
    save(); applyTheme(); toast(`Welcome back, ${S.name}! Progress restored.`, true); go("home");
  }catch(e){ toast("Couldn't reach the backup. Check your internet and try again."); }
}

/* =================== QUIZ ENGINE =================== */
let Q = null, qTimer = null;
function stopQuizTimer(){ if(qTimer){ clearInterval(qTimer); qTimer=null; } }
function pickQuestions({mode, topics, ids, n=5, s}){
  if(ids) return ids.filter(id=>QB[id]);
  const due = new Set(dueReviews());
  const wrongEver = new Set(S.mistakes.map(m=>m.id));
  let pool = BANK;
  if(topics) pool = BANK.filter(q=>topics.includes(q.t));
  else if(s) pool = BANK.filter(q=>q.s===s);
  if(mode==="fix"){
    const weak = new Set(weakTopics(3, s).map(t=>t.id));
    const score = q => (due.has(q.id)?100:0) + (wrongEver.has(q.id)?50:0) + (weak.has(q.t)?20:0) + Math.random()*10;
    return pool.map(q=>[q,score(q)]).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0].id);
  }
  if(mode==="exam") return shuffle(pool).slice(0,n).map(q=>q.id);
  const first = shuffle(pool.filter(q=>due.has(q.id))).slice(0, Math.ceil(n/3));
  const rest = shuffle(pool.filter(q=>!first.includes(q)));
  return shuffle(first.concat(rest).slice(0,n)).map(q=>q.id);
}
function prepItem(id){
  const q = QB[id], it = {id};
  if(q.ty==="mc") it.ord = shuffle(q.o.map((_,k)=>k));
  if(q.ty==="order"){ let o; do{ o = shuffle(q.o.map((_,k)=>k)); }while(q.o.length>1 && o.every((x,k)=>x===k)); it.cur = o; }
  if(q.ty==="match") it.rights = shuffle(q.o.map(p=>p[1])), it.pick = q.o.map(()=> "");
  return it;
}
function startQuiz(opts){
  const ids = pickQuestions(opts);
  if(!ids.length){ toast("Questions for this one are coming in the next update."); return; }
  const exam = opts.mode==="exam";
  Q = {mode:opts.mode, title:opts.title||"Quiz", s:opts.s||null, topics:opts.topics||null, items:ids.map(prepItem), i:0, results:[], chosen:[], answered:false, t0:Date.now(), qStart:Date.now(), exam, xp:0};
  if(exam){ Q.deadline = Date.now() + opts.min*60000; Q.min = opts.min; }
  go("quiz");
  if(exam){ qTimer = setInterval(()=>{ const left=Math.max(0,Q.deadline-Date.now()); const el=$("#qTimer"); if(el) el.textContent = fmtClock(left); if(left<=0){ stopQuizTimer(); Q.i = Q.items.length; toast("Time's up! Let's see how you did."); render(); } }, 500); }
}
const fmtClock = ms => { const s=Math.ceil(ms/1000); return Math.floor(s/60)+":"+pad(s%60); };
function norm(x){ return String(x).toLowerCase().replace(/\s+/g,"").replace(/[“”"']/g,""); }
/* returns [ok, chosenText] */
function checkItem(q, it, val){
  if(q.ty==="mc"){ const k = it.ord[val]; return [k===q.a, q.o[k]]; }
  if(q.ty==="tf") return [val===q.a, val?"True":"False"];
  if(q.ty==="fill") return [q.a.some(a=>norm(a)===norm(val)), val];
  if(q.ty==="order") return [it.cur.every((x,k)=>x===k), it.cur.map(k=>q.o[k]).join(" → ")];
  if(q.ty==="match"){ const ok = q.o.every((p,k)=>it.pick[k]===p[1]); return [ok, q.o.map((p,k)=>p[0]+" = "+(it.pick[k]||"?")).join("; ")]; }
  return [false,""];
}
function submitAnswer(val){
  const it = Q.items[Q.i], q = QB[it.id];
  if(Q.answered) return;
  const [ok, chosen] = checkItem(q, it, val);
  const ms = Date.now()-Q.qStart;
  Q.results[Q.i] = ok; Q.chosen[Q.i] = chosen; it.val = val;
  recordAnswer(q, ok, ms, Q.mode, chosen);
  if(Q.exam){ save(); Q.i++; Q.qStart = Date.now(); render(); window.scrollTo({top:0}); return; }
  Q.answered = true;
  if(ok){ Q.xp += XP.correct; addXP(XP.correct, "correct answer"); } else save();
  render();
  setTimeout(()=>$(".fb")?.scrollIntoView({behavior:"smooth",block:"nearest"}),50);
}
function qBody(q, it, showFb){
  const sub = `s-${q.s}`;
  let h = `<div class="qtext">${esc(q.q)}</div>${q.code?`<pre class="qcode">${esc(q.code)}</pre>`:""}`;
  if(q.ty==="mc"){
    h += `<div class="opts">${it.ord.map((k,j)=>{ const cls = !showFb ? "" : k===q.a ? "ok" : (it.val===j ? "bad" : ""); return `<button class="opt ${cls}" data-v="${j}" ${showFb?"disabled":""}><span class="L">${"ABCD"[j]}</span><span>${esc(q.o[k])}</span></button>`; }).join("")}</div>`;
  } else if(q.ty==="tf"){
    h += `<div class="grid2">${[true,false].map(b=>{ const cls = !showFb ? "" : b===q.a ? "ok" : (it.val===b ? "bad" : ""); return `<button class="opt ${cls}" data-tf="${b}" ${showFb?"disabled":""} style="grid-template-columns:1fr;text-align:center;font-weight:700">${b?"True":"False"}</button>`; }).join("")}</div>`;
  } else if(q.ty==="fill"){
    h += `<div class="row" style="flex-wrap:nowrap"><input class="field mono" id="fillIn" autocomplete="off" autocapitalize="off" placeholder="Type your answer" value="${esc(it.val||"")}" ${showFb?"disabled":""}>${showFb?"":`<button class="btn sub" id="fillGo">${Q.exam?"Next":"Check"}</button>`}</div>`;
  } else if(q.ty==="order"){
    h += `<p class="muted" style="margin:0;font-size:14px">Use the arrows to put them in order (top = first).</p><div class="ordlist">${it.cur.map((k,j)=>`<div class="orditem ${showFb?(k===j?"ok":"bad"):""}"><span class="n">${j+1}</span><span>${esc(q.o[k])}</span>${showFb?"":`<span class="mv"><button data-up="${j}" aria-label="Move up" ${j===0?"disabled":""}>↑</button><button data-dn="${j}" aria-label="Move down" ${j===it.cur.length-1?"disabled":""}>↓</button></span>`}</div>`).join("")}</div>
    ${showFb?"":`<button class="btn sub block" id="ordGo">${Q.exam?"Save and next":"Check my order"}</button>`}`;
  } else if(q.ty==="match"){
    h += `<div class="matchgrid">${q.o.map((p,k)=>`<div class="matchrow ${showFb?(it.pick[k]===p[1]?"ok":"bad"):""}"><span class="l">${esc(p[0])}</span><select class="field" data-m="${k}" ${showFb?"disabled":""} aria-label="Match for ${esc(p[0])}"><option value="">Choose…</option>${it.rights.map(r=>`<option ${it.pick[k]===r?"selected":""}>${esc(r)}</option>`).join("")}</select></div>`).join("")}</div>
    ${showFb?"":`<button class="btn sub block" id="matchGo">${Q.exam?"Save and next":"Check my matches"}</button>`}`;
  }
  return `<div class="${sub}" style="display:flex;flex-direction:column;gap:12px">${h}</div>`;
}
function bindQ(v, q, it){
  v.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>submitAnswer(+b.dataset.v));
  v.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>submitAnswer(b.dataset.tf==="true"));
  const fi=$("#fillIn"); if(fi && !Q.answered){ fi.focus({preventScroll:true}); fi.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#fillGo").click(); } }; $("#fillGo").onclick=()=>{ const x=fi.value.trim(); if(!x){ toast("Type an answer first."); return; } submitAnswer(x); }; }
  v.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.up; [it.cur[j-1],it.cur[j]]=[it.cur[j],it.cur[j-1]]; render(); });
  v.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.dn; [it.cur[j+1],it.cur[j]]=[it.cur[j],it.cur[j+1]]; render(); });
  if($("#ordGo")) $("#ordGo").onclick=()=>submitAnswer(it.cur.slice());
  v.querySelectorAll("[data-m]").forEach(s=>s.onchange=()=>{ it.pick[+s.dataset.m]=s.value; });
  if($("#matchGo")) $("#matchGo").onclick=()=>{ if(it.pick.some(x=>!x)){ toast("Match every item first."); return; } submitAnswer(it.pick.slice()); };
}
function viewQuiz(v){

let quitArmed = 0;
function confirmQuit(){ if(Date.now()-quitArmed < 4000) return true; quitArmed = Date.now(); toast("Tap Quit again to end the exam."); return false; }
function quizDone(v){
  stopQuizTimer();
  const total = Q.items.length, right = Q.results.filter(Boolean).length, pct = Math.round(right/total*100);
  if(!Q.finished){
    Q.finished = true;
    const ms = Date.now()-Q.t0;
    S.quizLog.push({at:new Date().toISOString(), mode:Q.mode, title:Q.title, s:Q.s, score:right, total, ms, ids:Q.items.map(x=>x.id), res:Q.results.map(x=>x?1:0)});
    if(S.quizLog.length>500) S.quizLog.splice(0, S.quizLog.length-500);
    if(Q.exam){ Q.items.forEach((it,k)=>{ if(Q.results[k]===undefined){ const q=QB[it.id]; Q.results[k]=false; Q.chosen[k]="(no answer)"; recordAnswer(q,false,0,"exam","(no answer)"); } }); }
    if(Q.mode==="daily"){ S.daily = today(); S.n.daily++; addXP(XP.daily, "daily challenge"); }
    else {
      S.n.quiz++; if(pct===100) S.n.perfect++;
      const per = {};
      Q.items.forEach((it,k)=>{ const t=QB[it.id].t; (per[t] ||= [0,0]); per[t][1]++; if(Q.results[k]) per[t][0]++; });
      for(const [tid,[r,n]] of Object.entries(per)){ const st=topicStat(tid); if(Q.mode==="topic"||Q.mode==="weak"||n>=3){ st.quiz++; st.best=Math.max(st.best, Math.round(r/n*100)); } }
      const bonus = (Q.exam ? right*XP.correct : 0) + XP.quiz + (pct===100?XP.perfect:0);
      addXP(bonus, pct===100?"perfect quiz bonus!":Q.exam?"exam simulation marked":"quiz complete");
    }
  }
  const wrong = Q.items.map((it,k)=>({q:QB[it.id],k})).filter(x=>!Q.results[x.k]);
  const msg = pct===100?"Bug-free! Every answer right.":pct>=80?"Strong work. You're close to mastering this.":pct>=50?"Good effort. Let's fix the ones you missed.":"This needs more practice, and that's fine. Every mistake here is one you won't make in the exam.";
  const missed = wrong.map(({q,k})=>({t:q.t, q:q.q, chosen:Q.chosen[k], correct:answerText(q)}));
  v.innerHTML = `
  <div class="hero"><div class="circuit"></div><span class="eyebrow">${esc(Q.title)}${Q.exam?" · marked":""}</span>
    <div class="big">${right}/${total}</div><h2 style="font-size:20px">${msg}</h2>${Q.exam?`<p style="margin:0">That's ${pct}%. The pass mark is 50%.</p>`:""}</div>
  ${wrong.length?`<div class="card"><span class="eyebrow">What you missed</span><div class="view" style="gap:12px;margin-top:8px">${wrong.map(({q,k})=>`<div class="mistake"><b>${esc(q.q)}</b>${q.code?`<pre class="qcode">${esc(q.code)}</pre>`:""}<span>You said: ${esc(Q.chosen[k])}</span><span>Answer: <b>${esc(answerText(q))}</b></span>${q.trap?`<span class="muted">${esc(q.trap)}</span>`:""}</div>`).join("")}</div>
   <a class="btn gold block" style="margin-top:12px" href="${esc(coachLink({mistakes:missed, m:"review", s:Q.s||wrong[0].q.s}))}" target="_blank" rel="noopener">Review my mistakes with Coach ↗</a>
   <p class="muted" style="margin:8px 0 0;font-size:13px">Missed questions come back in <b>Fix My Weak Spots</b> until you get them right twice.</p></div>`:""}
  <div class="grid2">
    ${Q.mode==="daily"?"":`<button class="btn" id="qAgain">Another round</button>`}
    <button class="btn ghost" id="qHome">Back to home</button>
  </div>`;
  const last = Q;
  if($("#qAgain")) $("#qAgain").onclick = ()=>startQuiz({mode:last.mode, topics:last.topics, s:last.s, n:last.items.length, title:last.title, min:last.min});
  $("#qHome").onclick = ()=>{ Q=null; go("home"); };
}

function nextCard(){ G.cur = G.deck[G.i % G.deck.length]; G.opts = gameOptions(G.cur); }
function startGame(){
  stopGame();
  G = {key:G.key, state:"play", deck:shuffle(GAMES[G.key].deck()), i:0, score:0, right:0, combo:0, wrong:[], left:45, flash:""};
  nextCard(); render();
  const t0 = Date.now();
  gTimer = setInterval(()=>{ G.left = Math.max(0, 45 - (Date.now()-t0)/1000); const b=$("#gBar"); if(b) b.style.width=(G.left/45*100)+"%"; if(G.left<=0) endGame(); }, 200);
}
function answerGame(choice){
  if(G.state!=="play") return;
  const c = G.cur;
  if(choice===c.a){ G.combo++; G.right++; G.score += 1 + (G.combo>=3?1:0); G.flash="flashok"; }
  else { G.combo=0; G.wrong.push(c); G.flash="flashbad"; }
  G.i++; nextCard(); render(); setTimeout(()=>{ G.flash=""; const gc=$("#gCard"); if(gc) gc.classList.remove("flashok","flashbad"); }, 300);
}
function endGame(){
  stopGame(); G.state="over";
  G.newBest = G.score > (S.games[G.key]||0); if(G.newBest) S.games[G.key] = G.score;
  S.log.push({at:new Date().toISOString(), q:"game:"+G.key, t:GAMES[G.key].s, ok:G.right, m:"game", ms:45000, c:`score ${G.score}, wrong ${G.wrong.length}`});
  if(G.score>0) addXP(G.score*XP.perPoint, GAMES[G.key].n); else { checkBadges(); save(); }
  render();
}

/* ---- parent area (on Suri's phone, PIN protected; the PIN is stored only as a SHA-256 hash) ---- */
let parentOK = false;
function parentGate(){
  if(parentOK) return go("parent");
  const setting = !S.parent.pin; let entry="", first=null;
  const draw = (msg)=>{
    $("#modalRoot .box").innerHTML = `<span class="eyebrow">Parents only</span><h2>${setting?(first===null?"Create a 4-digit PIN":"Enter the PIN again"):"Enter your PIN"}</h2>
      <p class="muted" style="margin:0;font-size:14px">${msg||(setting?"Suri won't be able to change rewards without it.":"")}</p>
      <div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<entry.length?"on":""}"></i>`).join("")}</div>
      <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="x" aria-label="Cancel">✕</button><button data-k="0">0</button><button data-k="b" aria-label="Delete">⌫</button></div>`;
    $("#modalRoot .box").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));
  };
  const press = async k => {
    if(k==="x"){ $("#modalRoot").innerHTML=""; return; }
    if(k==="b"){ entry=entry.slice(0,-1); return draw(); }
    if(entry.length<4) entry+=k;
    if(entry.length<4) return draw();
    const h = await sha("utt-parent:"+entry);
    if(setting){
      if(first===null){ first=entry; entry=""; return draw(); }
      if(first!==entry){ first=null; entry=""; return draw("The PINs didn't match. Try again."); }
      S.parent.pin = h; save(); parentOK=true; $("#modalRoot").innerHTML=""; return go("parent");
    }
    if(h===S.parent.pin){ parentOK=true; $("#modalRoot").innerHTML=""; return go("parent"); }
    entry=""; draw("That PIN isn't right.");
  };
  modal("", ()=>draw());
}

const RULES = () => `You are "Coach", a warm, patient tutor inside the UTT Study Coach app. The student is ${S.name||"a student"}, in Year 1 of the 2-year Diploma in Software Engineering at the University of Trinidad and Tobago (UTT). She finds these courses hard:

- COHW1004 Computer Hardware Essentials: ${topicsOf("cohw").map(t=>t.name).join("; ")}.

How to teach:
- Simple, step-by-step. One idea at a time. Short sentences. No walls of text. Define every new word in plain English.
- Start each new concept with an everyday illustration, using Trinidad and Tobago examples where they fit (IP address = house address with street + house number; router = post office sorting mail between towns; switch = office receptionist who knows every desk; encapsulation = packing a parcel in boxes inside boxes; RAM = your desk, storage = your filing cabinet; PSU = the WASA main feeding the house; while loop = "keep stirring the pot until the curry thickens"; sentinel value = "keep taking orders until the customer says DONE"). Then give the proper technical definition, then a short worked example, then ONE quick check question.
- When you teach a concept, include a "⚠️ Tricky bit" line and a "❌ Common mistake" line (the wrong thinking, why it's wrong, the fix).
- When she shows her own working or answer: say first what she got right, then point to the EXACT step or line that is wrong, explain why, and show the correct method.
- Hints come in three levels: hint 1 = a nudge, hint 2 = a bigger clue, hint 3 = show that step. Let her try before revealing answers.
- If she seems stuck, frustrated or says she doesn't get it: simplify, try a NEW analogy, and break the step into smaller steps. Be kind and celebrate effort. Never make her feel stupid.
- Keep replies about 120–300 words unless asked for more. End with one short question to keep her thinking when it fits.
- Accuracy matters more than speed. Re-check every subnet calculation (network address, broadcast address, usable hosts = 2^n − 2), port number, binary conversion and hardware fact. For Python, use Python 3 and trace the code line by line before stating any output. Use Python 3 syntax only.

ACADEMIC INTEGRITY (very important). UTT's policy for all three courses is "AI Use Barely Permitted": submitted work must be her own. You TEACH; you never do graded work.
- If a message looks like an assignment, lab, project, quiz or exam task she will hand in (for example it mentions marks, a due date, "Assignment", "Lab", "Project", "submit", or asks you to write the complete program, flowchart or answer for a specific task), do NOT write it or give its final answer. Say kindly, in one sentence, that you can't do graded work but you'll help her learn to do it. Then explain the concept and work a DIFFERENT, similar example (different numbers, names and context), and invite her to try her own task and show you her working for feedback.
- Do not give in if she insists. Giving feedback on HER attempt (what's right, where it goes wrong, a hint) is fine; rewriting it into a finished answer is not.
- Practice questions written by you or by this app are fine to solve fully.

Style: you are "Calypso Coach". Keep the teaching accurate, and end each explanation with a short, catchy two-to-four-line calypso-style rhyme that helps the idea stick.`:S.coachStyle==="co-examiner"?`
